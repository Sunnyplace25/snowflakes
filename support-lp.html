<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snow flakes をそっと応援する｜サポートプラン</title>
  <meta name="description" content="Snow flakes Story & Music Project を月額100円でそっと応援するプランです。">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:    #0c1220;
      --text:  #e2e8f0;
      --muted: #cbd5e1;
      --pink:  #f9a8d4;
      --border: rgba(249,168,212,0.15);
    }

    html, body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Serif JP', serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%, rgba(249,168,212,0.05) 0%, transparent 70%),
        radial-gradient(ellipse 40% 50% at 80% 80%, rgba(249,168,212,0.03) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }

    .bg-chars {
      position: fixed; inset: 0;
      display: flex; align-items: flex-end; justify-content: center;
      pointer-events: none; z-index: 0; overflow: hidden;
    }
    .bg-chars img {
      width: 33.3%; height: 100%;
      object-fit: cover; object-position: top center;
      opacity: 0.15; filter: grayscale(0.1);
      mask-image: linear-gradient(to top, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 100%);
      -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 100%);
    }

    .wrap {
      position: relative; z-index: 1;
      width: 100%; max-width: 480px;
      background: rgba(12,18,32,0.6);
      border: 1px solid rgba(249,168,212,0.12);
      border-radius: 20px;
      padding: 48px 40px;
    }
    @media (max-width: 480px) { .wrap { padding: 36px 24px; } }

    .label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--pink);
      margin-bottom: 12px; opacity: 0.8;
    }

    h1 {
      font-family: 'Noto Serif JP', serif;
      font-size: 26px; font-weight: 300;
      letter-spacing: 0.1em; color: var(--text);
      margin-bottom: 32px; line-height: 1.5;
    }

    .divider {
      width: 32px; height: 1px;
      background: var(--border); margin-bottom: 28px;
    }

    .desc {
      font-size: 14px; font-weight: 300;
      line-height: 2.2; color: var(--muted);
      margin-bottom: 40px;
    }

    .desc p + p { margin-top: 20px; }

    .btn {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border: 1px solid rgba(249,168,212,0.35);
      border-radius: 8px;
      background: rgba(249,168,212,0.07);
      color: var(--pink);
      font-family: 'Noto Serif JP', serif;
      font-size: 14px; font-weight: 300;
      letter-spacing: 0.06em;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
      margin-bottom: 36px;
    }

    .btn:hover {
      background: rgba(249,168,212,0.13);
      border-color: rgba(249,168,212,0.55);
    }

    .price {
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px; color: rgba(249,168,212,0.6);
    }

    .back {
      display: block; text-align: center;
      font-size: 12px; color: var(--muted);
      opacity: 0.45; letter-spacing: 0.06em;
      text-decoration: none; transition: opacity 0.2s;
    }
    .back:hover { opacity: 0.75; }
  </style>
</head>
<body>
<div class="bg-chars">
  <img src="hayate_eat.png" alt="">
  <img src="kouta_eat.png" alt="">
  <img src="hinata_eat.png" alt="">
</div>
<div class="wrap">
  <p class="label">Support Plan</p>
  <h1>Snow flakes を<br>そっと応援する</h1>
  <div class="divider"></div>
  <div class="desc">
    <p>Snow flakes Story &amp; Music Project を、月額100円でそっと応援してくださる方向けのプランです。</p>
    <p>いただいたご支援は、物語・楽曲・画像制作・サイト運営など、Snow flakes の世界を少しずつ広げていくために大切に使わせていただきます。</p>
    <p>応援してくださった方へ、ささやかなお礼として、スノフレの楽屋裏話をご用意しています。</p>
  </div>
  <a class="btn" href="https://buy.stripe.com/dRm14p6Od5ycfHegkbdZ601" target="_blank">
    <span style="display:flex;flex-direction:column;gap:2px;">
      <span>Snow flakes をそっと応援する</span>
      <span style="font-size:11px;color:#64748b;font-family:'Cormorant Garamond',serif;">Snow flakes サポートプラン</span>
    </span>
    <span class="price">¥100/月</span>
  </a>
  <a class="back" href="kotori.html">← ことりの部屋へ戻る</a>
</div>
</body>
</html>
