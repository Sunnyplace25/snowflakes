<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:     #0c1220;
      --text:   #e2e8f0;
      --muted:  #94a3b8;
      --hinata: #93c5fd;
      --border: rgba(147,197,253,0.15);
    }

    html, body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Serif JP', serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* 背景のグロー */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%, rgba(147,197,253,0.06) 0%, transparent 70%),
        radial-gradient(ellipse 40% 50% at 80% 80%, rgba(147,197,253,0.04) 0%, transparent 60%);
      pointer-events: none;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 460px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255,255,255,0.03);
      padding: 48px 40px 44px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--hinata);
      margin-bottom: 12px;
      opacity: 0.8;
    }

    h1 {
      font-family: 'Noto Serif JP', serif;
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 0.12em;
      color: var(--text);
      margin-bottom: 32px;
      line-height: 1.3;
    }

    .divider {
      width: 32px;
      height: 1px;
      background: var(--border);
      margin-bottom: 28px;
    }

    .desc {
      font-size: 14px;
      font-weight: 300;
      line-height: 2;
      color: var(--muted);
      margin-bottom: 36px;
    }

    .desc p + p {
      margin-top: 20px;
    }

    .cta {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0;
    }

    .cta-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
      opacity: 0.6;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 13px 28px;
      border: 1px solid rgba(147,197,253,0.35);
      border-radius: 8px;
      background: rgba(147,197,253,0.07);
      color: var(--hinata);
      font-family: 'Noto Serif JP', serif;
      font-size: 14px;
      font-weight: 300;
      letter-spacing: 0.08em;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn:hover {
      background: rgba(147,197,253,0.13);
      border-color: rgba(147,197,253,0.55);
    }

    .btn .price {
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      color: rgba(147,197,253,0.6);
      font-weight: 300;
    }

    .back {
      margin-top: 36px;
      font-size: 12px;
      color: var(--muted);
      opacity: 0.45;
      letter-spacing: 0.06em;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .back:hover { opacity: 0.75; }

    @media (max-width: 480px) {
      .card { padding: 40px 28px 36px; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>

  <div class="card">
    <p class="label">Web App</p>
    <h1>放課後のヒナタ</h1>
    <div class="divider"></div>
    <div class="desc">
      <p>誰もいない放課後の音楽室で、<br>高校時代のヒナタと少しだけ話せるAIチャットアプリです。</p>
      <p>月額300円の応援プランに参加するとご利用いただけます。</p>
      <p>コウタ・ハヤテも準備中。<br>今後のアップデートで、高校時代・大学時代・社会人時代など、少しずつ会話できる時間が広がっていく予定です。</p>
    </div>
    <div class="cta">
      <p class="cta-label">Support Plan</p>
      <a class="btn" href="https://buy.stripe.com/cNi14pc8xe4Idz63xpdZ600" target="_blank">
        応援する <span class="price">¥300/月</span>
      </a>
    </div>
  </div>

  <a class="back" href="../kotori.html">← ことりの部屋へ戻る</a>

</body>
</html>
