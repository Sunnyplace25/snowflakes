<script>
  SfSite.renderWork(document.getElementById('work'), 'otohazu', { root: '../../' });

  // 章から読む（chapter/arcs.js）。連載中の章の話数は、なろう API の話数が増えていたらそれに合わせる
  (function () {
    var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); };
    var ARCS = window.SF_ARCS || [], lastNo = window.SF_EPISODE_LAST ? SF_EPISODE_LAST() : 0;
    function render() {
      document.getElementById('sf-arcs').innerHTML = '<div class="sf-arc-grid">' + ARCS.filter(function (a) { return a.parts[0].from <= lastNo; }).map(function (a) {
        var from = a.parts[0].from, lp = a.parts[a.parts.length - 1], to = Math.min(lp.to == null ? lastNo : lp.to, lastNo);
        return '<a class="sf-arc-card" href="chapter/' + a.id + '/"><span class="sf-arc-label">' + esc(a.label) + '</span>' +
          '<span class="sf-arc-title">' + esc(a.title) + '</span><span class="sf-arc-range">ep.' + from + '〜' + to + (a.ongoing ? '・連載中' : '') + '</span></a>';
      }).join('') + '</div>';
    }
    render();
    // 「章から読む」を、いちばん下から上へ（あらすじがあればそのすぐ下、なければ「最新の更新」のすぐ下）へ移す（2026-11-07）
    var syn = document.getElementById('synopsis'), upd = document.getElementById('update'), chs = document.getElementById('chapters');
    var after = syn || upd;
    if (chs && after) after.parentNode.insertBefore(chs, after.nextSibling);
    var songs = (window.SF_ARC_SITE || {}).songs || [];
    if (songs.length) {
      document.getElementById('songs').hidden = false;
      document.getElementById('sf-songs').innerHTML = songs.map(function (m) {
        return '<a class="sf-song" href="https://youtube.com/shorts/' + esc(m.yt) + '" target="_blank" rel="noopener"><img src="https://i.ytimg.com/vi/' + esc(m.yt) + '/oar2.jpg" alt="' + esc(m.title) + '" loading="lazy">' +
          '<span class="sf-song-body"><span class="sf-song-title">' + esc(m.title) + '</span><span class="sf-song-note">' + esc(m.note || '') + '</span></span></a>';
      }).join('');
    }
    SfSite.narou(function (map) { var n = map && map.n1351mq && +map.n1351mq.episodes; if (n > 0 && n !== lastNo) { lastNo = n; render(); } });
  })();
</script>
