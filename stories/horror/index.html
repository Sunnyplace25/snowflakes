<!-- BGM（ホラー特集 horror.html と同じ2曲を交互に。音量 15%。開いたときに流せる環境では自動で流れ、右下のボタンで止める／流す） -->
<audio id="horror-bgm" preload="none"></audio>
<button id="bgm-btn" type="button" onclick="toggleBGM()" aria-label="BGM の再生・停止" style="position:fixed;bottom:24px;right:20px;z-index:100;background:rgba(10,10,20,0.75);border:1px solid rgba(239,68,68,0.25);border-radius:50px;padding:8px 16px;color:#f87171;font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:3px;cursor:pointer;backdrop-filter:blur(6px);transition:border-color 0.2s,color 0.2s;">♪ BGM</button>
<script>
var _bgmPlaying = false;
var _bgmTracks = ['../../horror_bgm.mp3', '../../horror_bgm2.mp3'];
var _bgmIndex = 0;
var _bgmAudio = document.getElementById('horror-bgm');
// 2つ同時に流れないように（2026-11-01）
// ・別のタブ／ページで BGM が流れ始めたら、こちらは止める
// ・ページを移るときは止め、曲と再生位置を覚えておいて、次のホラーのページで続きから流す（頭から流し直さない）
var _bgmId = Math.random().toString(36).slice(2), _bgmResume = 0;
var _bgmCh = ('BroadcastChannel' in window) ? new BroadcastChannel('sf-horror-bgm') : null;
if (_bgmCh) _bgmCh.onmessage = function(e) { if (e.data && e.data.playing && e.data.id !== _bgmId && _bgmPlaying) toggleBGM(); };
_bgmAudio.addEventListener('play', function() { if (_bgmCh) _bgmCh.postMessage({ playing: true, id: _bgmId }); });
try { var _bgmSaved = JSON.parse(sessionStorage.getItem('sf_horror_bgm') || 'null'); if (_bgmSaved && Date.now() - _bgmSaved.at < 60000) { _bgmIndex = _bgmSaved.i % _bgmTracks.length; _bgmResume = _bgmSaved.t || 0; } } catch (e) {}
_bgmAudio.addEventListener('loadedmetadata', function() { if (_bgmResume && _bgmResume < _bgmAudio.duration) _bgmAudio.currentTime = _bgmResume; _bgmResume = 0; });
window.addEventListener('pagehide', function() {
  try { sessionStorage.setItem('sf_horror_bgm', JSON.stringify({ i: _bgmIndex, t: _bgmAudio.currentTime || 0, at: Date.now() })); } catch (e) {}
  _bgmAudio.pause();
});
window.addEventListener('pageshow', function(e) { if (e.persisted && _bgmPlaying) _bgmAudio.play().catch(function() {}); });   // 「戻る」で戻ってきたとき
_bgmAudio.addEventListener('ended', function() {
  if (_bgmPlaying) {
    _bgmIndex = (_bgmIndex + 1) % _bgmTracks.length;
    _bgmAudio.src = _bgmTracks[_bgmIndex];
    _bgmAudio.play();
  }
});
function bgmLook(on) {
  var btn = document.getElementById('bgm-btn');
  btn.style.color = on ? '#fca5a5' : '#f87171';
  btn.style.borderColor = on ? 'rgba(239,68,68,0.6)' : 'rgba(239,68,68,0.25)';
  btn.textContent = on ? '♪ ON' : '♪ BGM';
}
function toggleBGM() {
  if (_bgmPlaying) {
    _bgmAudio.pause();
    _bgmPlaying = false;
    bgmLook(false);
  } else {
    _bgmAudio.src = _bgmTracks[_bgmIndex];
    _bgmAudio.volume = 0.15;
    _bgmAudio.play().then(function() { _bgmPlaying = true; bgmLook(true); }).catch(function() {});
  }
}
window.addEventListener('load', function() {
  _bgmAudio.src = _bgmTracks[_bgmIndex];
  _bgmAudio.volume = 0.15;
  _bgmAudio.play().then(function() { _bgmPlaying = true; bgmLook(true); }).catch(function() {});
});
</script>
