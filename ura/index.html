<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snow flakes 裏話</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0c1220;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: rgba(255,255,255,0.08);
    }
    html, body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Serif JP', serif;
    }

    #content {
      max-width: 640px;
      margin: 0 auto;
      padding: 60px 24px 80px;
    }
    .content-header {
      margin-bottom: 48px;
    }
    .content-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px;
      letter-spacing: 5px;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .content-title {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }
    .content-sub {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--muted);
      opacity: 0.5;
    }
    .divider {
      width: 32px;
      height: 1px;
      background: var(--border);
      margin: 32px 0;
    }
    .post {
      padding: 32px 0;
      border-bottom: 1px solid var(--border);
    }
    .post:last-child { border-bottom: none; }
    .post-date {
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--muted);
      margin-bottom: 12px;
      opacity: 0.6;
    }
    .post-title {
      font-size: 16px;
      font-weight: 300;
      letter-spacing: 0.08em;
      margin-bottom: 20px;
    }
    .post-body {
      font-size: 14px;
      font-weight: 300;
      line-height: 2.2;
      color: #cbd5e1;
    }
    .post-body p + p { margin-top: 20px; }
  </style>
</head>
<body>

  <div id="content">
    <div class="content-header">
      <p class="content-label">SNOW FLAKES / 裏話</p>
      <h1 class="content-title">裏話</h1>
      <p class="content-sub">supporter only</p>
    </div>
    <div class="divider"></div>

    <!-- ▼ 投稿はここに追加 -->
    <div class="post">
      <p class="post-date">2026.06 —</p>
      <h2 class="post-title">準備中</h2>
      <div class="post-body">
        <p>ページを作りました。<br>もう少ししたら、最初の裏話を投稿します。</p>
      </div>
    </div>
    <!-- ▲ 投稿ここまで -->

    <p style="margin-top:48px;font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:2px;color:var(--muted);opacity:0.4;line-height:2;">このページはURLを知っている方だけがアクセスできます。<br>ブックマークに追加して保存しておいてください。</p>

  </div>

</body>
</html>
