<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snow flakes 裏話</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0c1220;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: rgba(255,255,255,0.08);
    }
    html, body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Serif JP', serif;
    }

    /* ── ゲート画面 ── */
    #gate {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 24px;
    }
    .gate-card {
      width: 100%;
      max-width: 360px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255,255,255,0.02);
      padding: 48px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      text-align: center;
    }
    .gate-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px;
      letter-spacing: 5px;
      color: var(--muted);
      margin-bottom: 20px;
    }
    .gate-title {
      font-size: 20px;
      font-weight: 300;
      letter-spacing: 0.12em;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .gate-input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text);
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px;
      letter-spacing: 2px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 14px;
    }
    .gate-input:focus { border-color: rgba(255,255,255,0.2); }
    .gate-btn {
      width: 100%;
      padding: 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Cormorant Garamond', serif;
      font-size: 12px;
      letter-spacing: 4px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .gate-btn:hover { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.18); }
    .gate-error {
      font-size: 11px;
      color: #f87171;
      letter-spacing: 1px;
      margin-top: 12px;
      height: 16px;
      font-family: 'Cormorant Garamond', serif;
    }
    .gate-note {
      font-size: 11px;
      color: var(--muted);
      margin-top: 28px;
      letter-spacing: 1px;
      line-height: 2;
      opacity: 0.5;
      font-family: 'Cormorant Garamond', serif;
    }

    /* ── コンテンツ画面 ── */
    #content {
      display: none;
      max-width: 640px;
      margin: 0 auto;
      padding: 60px 24px 80px;
    }
    .content-header {
      margin-bottom: 48px;
    }
    .content-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px;
      letter-spacing: 5px;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .content-title {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }
    .content-sub {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--muted);
      opacity: 0.5;
    }
    .divider {
      width: 32px;
      height: 1px;
      background: var(--border);
      margin: 32px 0;
    }
    .post {
      padding: 32px 0;
      border-bottom: 1px solid var(--border);
    }
    .post:last-child { border-bottom: none; }
    .post-date {
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--muted);
      margin-bottom: 12px;
      opacity: 0.6;
    }
    .post-title {
      font-size: 16px;
      font-weight: 300;
      letter-spacing: 0.08em;
      margin-bottom: 20px;
    }
    .post-body {
      font-size: 14px;
      font-weight: 300;
      line-height: 2.2;
      color: #cbd5e1;
    }
    .post-body p + p { margin-top: 20px; }
    .logout {
      display: inline-block;
      margin-top: 48px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--muted);
      opacity: 0.35;
      cursor: pointer;
      transition: opacity 0.2s;
      background: none;
      border: none;
    }
    .logout:hover { opacity: 0.65; }
  </style>
</head>
<body>

  <!-- ゲート -->
  <div id="gate">
    <div class="gate-card">
      <p class="gate-label">SNOW FLAKES</p>
      <h1 class="gate-title">裏話</h1>
      <input id="pw-input" class="gate-input" type="password" placeholder="password" autocomplete="off">
      <button class="gate-btn" onclick="checkPw()">入る</button>
      <p class="gate-error" id="gate-error"></p>
      <p class="gate-note">Snow flakes サポートプラン加入者限定のページです。</p>
    </div>
  </div>

  <!-- コンテンツ -->
  <div id="content">
    <div class="content-header">
      <p class="content-label">SNOW FLAKES / 裏話</p>
      <h1 class="content-title">裏話</h1>
      <p class="content-sub">supporter only</p>
    </div>
    <div class="divider"></div>

    <!-- ▼ 投稿はここに追加 -->
    <div class="post">
      <p class="post-date">2026.06 —</p>
      <h2 class="post-title">準備中</h2>
      <div class="post-body">
        <p>ページを作りました。<br>もう少ししたら、最初の裏話を投稿します。</p>
      </div>
    </div>
    <!-- ▲ 投稿ここまで -->

    <button class="logout" onclick="logout()">── ログアウト ──</button>
  </div>

  <script>
    var PW = 'tuning440';
    var SESSION_KEY = 'sf_ura_session';

    function checkPw() {
      var val = document.getElementById('pw-input').value.trim();
      if (val === PW) {
        sessionStorage.setItem(SESSION_KEY, '1');
        showContent();
      } else {
        document.getElementById('gate-error').textContent = 'パスワードが違います';
        document.getElementById('pw-input').value = '';
      }
    }

    function showContent() {
      document.getElementById('gate').style.display = 'none';
      document.getElementById('content').style.display = 'block';
    }

    function logout() {
      sessionStorage.removeItem(SESSION_KEY);
      document.getElementById('gate').style.display = 'flex';
      document.getElementById('content').style.display = 'none';
      document.getElementById('pw-input').value = '';
    }

    document.getElementById('pw-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') checkPw();
    });

    // セッション維持
    if (sessionStorage.getItem(SESSION_KEY) === '1') showContent();
  </script>

</body>
</html>
