<svg xmlns="http://www.w3.org/2000/svg" width="200" height="40">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&amp;family=Noto+Sans+JP:wght@300;400&amp;display=swap');
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0B1220"/>
      <stop offset="100%" style="stop-color:#0F1A2E"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="200" height="40" fill="url(#bg)" rx="3"/>

  <!-- border -->
  <rect width="200" height="40" fill="none" stroke="rgba(147,197,253,0.15)" stroke-width="0.8" rx="3"/>

  <!-- snowflake icon -->
  <text x="8" y="24" font-size="10" fill="#9FB8FF" font-family="serif" opacity="0.85">❄</text>

  <!-- Snow flakes -->
  <text x="22" y="18"
    font-size="10.5"
    fill="#F0F6FF"
    font-family="'Playfair Display', 'Noto Serif JP', Georgia, serif"
    font-weight="700"
    letter-spacing="0.8">Snow flakes</text>

  <!-- 山吹ことり -->
  <text x="22" y="32"
    font-size="6.2"
    fill="#BFD3FF"
    font-family="'Playfair Display', 'Noto Serif JP', Georgia, serif"
    font-weight="400"
    letter-spacing="0.3">山吹ことり</text>

  <!-- separator -->
  <text x="62" y="32"
    font-size="5.5"
    fill="#4A5568"
    font-family="sans-serif">  ｜</text>

  <!-- Story & Music Project -->
  <text x="73" y="32"
    font-size="5.5"
    fill="#7F8CA3"
    font-family="'Noto Sans JP', 'Inter', 'Helvetica Neue', sans-serif"
    font-weight="300"
    letter-spacing="0.2">  Story &amp; Music Project</text>

</svg>
