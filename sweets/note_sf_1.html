<main>

  <div id="content-view" style="display:none;">
    <p class="note-eyebrow">NOTE</p>
    <h1 class="note-title">「白い音」解説</h1>
    <p class="note-sub">― Snow flakesという"三人の音"が重なり始める前夜 ―</p>

    <div class="divider"></div>
    <div class="body-wrap" id="note-body"></div>

      <div>
        <p class="related-meta">2026.04.30 / 短編</p>

      </div>

</main>

<script>
  var NOTE_ID = 'note_sf_1';

  document.addEventListener('DOMContentLoaded', function() {
    if (typeof SfSnow === 'undefined') return;

    if (!SfSnow.isUnlocked(NOTE_ID)) {
      document.getElementById('locked-view').style.display = '';
      document.getElementById('content-view').style.display = 'none';
      return;
    }

    document.getElementById('locked-view').style.display = 'none';
    document.getElementById('content-view').style.display = 'block';

    var sections = [
      { heading: null, body: '『白い音』は、\nSnow flakesが始まる前の時間を描いた短編です。\n\n大学に入り、\n三人はそれぞれ違う生活を過ごしている。\n\n同じ場所にはいる。\n\nでも、\nまだ今の形ではない。\n\nヒナタが、\n今よりもっと途中にいた頃。\n\nそして、\n音が誰かへ届く前の時間を描いています。\n\nこの物語は、\n大学時代のヒナタと、静かな時間を過ごしていた女性の視点で描かれています。' },
      { heading: '少しずつズレ始める時間', body: '高校卒業後、\nSnow flakesの三人は同じ大学へ内部進学します。\n\nただ、\n選んだ学部はそれぞれ違う。\n\n同じキャンパスにはいる。\n\nでも、\n頻繁に連絡を取り合っているわけでもない。\n\n授業。\n交友関係。\n生活リズム。\n\nそれぞれ別の時間を過ごしている。\n\n『白い音』で描かれているのは、\n\nそんな、\nまた音が重なっていく前の時間です。' },
      { heading: '「まだ途中」のヒナタ', body: 'ヒナタは、\nまだ途中の音を鳴らしている。\n\n大学の木陰。\nベンチ。\n途中の曲。\n\n完成した音ではなく、\nまだ形になりきらない音。\n\nSnow flakesのヒナタは、\n最初から完成された存在ではありません。\n\nずっと、\n「まだ途中」の人。\n\nだから彼女は、\n技術や言葉より先に、\n"ペースが合う"ことへ惹かれていきます。\n\n会話は多くない。\n沈黙も多い。\n\nでも、\n疲れない。\n\nその静かな距離感の中で、\n二人の時間は少しずつ重なっていく。\n\nそして、\n駅までの帰り道。\n\n理由もなく伸ばした手を、\nヒナタがゆっくり受け取る。\n\n『白い音』は、\n大きな告白の物語ではありません。\n\n少しずつ距離が近づいて、\n気づけば始まっていた。\n\nそんな関係を描いた物語です。' },
      { heading: '少しずつ、遠くを見るようになる', body: 'ヒナタは少しずつ変わっていきます。\n\n最初は、\n隣でギターを鳴らしていた。\n\nでも、\n音を探し始めてから、\n視線が遠くなる。\n\nベンチでギターを弾いていても、\nもう彼女を見ていない。\n\n音の向こうを見ている。\n\n彼女は、\nそれをちゃんと理解している。\n\n怒っているわけではない。\n嫌いになったわけでもない。\n\nただ、\n"音でいっぱいになっている"\nことが分かってしまう。\n\nだから、\n\n「ヒナタは私より音の方が大事なんだね」\n\nという言葉になる。\n\nこれは責める言葉ではありません。\n\n確認です。\n\nそしてヒナタは、\n否定できない。\n\n誰かを傷つけたいわけじゃない。\n\nでも、\n音を選んでしまう。' },
      { heading: '三人の音が重なり始める', body: 'ライブシーンでは、\n一人で鳴っていたヒナタの音へ、\nハヤテのドラムが突然重なります。\n\nその瞬間、\n音が少しだけ広がる。\n\n彼女はそこで思います。\n\n「ああ。行ってしまった。」\n\nこれは、\n恋愛の終わりではありません。\n\nヒナタが、\n自分のいる場所を見つけた瞬間です。\n\nそのあと、\n少し遅れてコウタが現れます。\n\nまだ音を鳴らしていない。\n\nただ、\nそこへ来る。\n\nヒナタとハヤテのいる場所へ、\nごく自然に加わる。\n\n気づけば、\n三人が並んでいる。\n\nあとから振り返ると、\nSnow flakesはこういう形で始まっていたのかもしれない。\n\n誰かが決めたわけでもなく、\n\n別々だった音が、\n少しずつ重なっていった先に。' },
      { heading: '『Little Snow』 Raw → Near', body: 'そして数年後、\n彼女は偶然、ライブハウスで\nSnow flakesを見る。\n\nここで演奏されるのが、\n『Little Snow』。\n\n『Little Snow』は、\n最初は"Raw"として存在していました。\n\nまだ剥き出しで、\n整理されていなくて、\n感情の輪郭も荒い音。\n\n『整えない音』で描かれるのは、\nまさにその状態です。\n\n整えることもできる。\nもっと安全な形へ直すこともできる。\n\nそれでもヒナタは、\n触れなかった。\n\n整えた瞬間、\nその夜の揺れが、\n別のものになってしまう気がしたから。\n\nだからRaw版の『Little Snow』は、\n"自分の中だけで鳴っている音"でした。\n\nでも、\n『白い音』終盤のライブでは、\nその曲が"Near"へ変わっている。\n\nNear。\n\n近い音。\n\nただ感情を吐き出すだけではなく、\n誰かの近くへ置こうとする音。\n\nそれは、\nヒナタ自身の変化でもあります。\n\n一人の音だったものが、\n三人の音になり、\nそして誰かへ届く音へ変わっていく。\n\nその変化が、\n『白い音』の終盤にも少しだけ見えているのかもしれません。' },
      { heading: '「私じゃ、きっとほどけない」', body: 'ラストの、\n\n「私じゃ、\n\u3000きっと\n\u3000ほどけない。」\n\nという一文。\n\nこれは諦めではありません。\n\n"今の自分では届かない"\n\nという理解です。\n\nだから彼女は、\n奪おうとしない。\n\nただ、\n\n「あの白い音が\n\u3000ヒナタを幸せにしますように」\n\nと願う。\n\n『白い音』は、\n誰かを失う物語ではありません。\n\n音へ向かっていく人を、\nそれでも好きだった記憶の物語です。\n\nそして同時に、\n\nあとから振り返ったとき、\nSnow flakesという"三人の音"が、\n静かに始まっていたことに気づく物語でもあります。' },
    ];

    var bodyEl = document.getElementById('note-body');
    var html = '';
    sections.forEach(function(sec) {
      if (sec.heading) {
        html += '<p class="section-heading">■ ' + sec.heading + '</p>';
        html += '<p class="section-spacer">\u3000</p>';
      }
      sec.body.split('\n').forEach(function(line) {
        html += '<p>' + (line === '' ? '\u3000' : line) + '</p>';
      });
      html += '<p class="section-spacer">\u3000</p>';
    });
    bodyEl.innerHTML = html;
  });

  (function() {
    var canvas = document.getElementById('snow');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);
    var flakes = [];
    for (var i = 0; i < 70; i++) {
      flakes.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        r: Math.random() * 2 + 0.5,
        speed: Math.random() * 0.5 + 0.2,
        drift: (Math.random() - 0.5) * 0.3,
        opacity: Math.random() * 0.5 + 0.2
      });
    }
    function drawSnow() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      flakes.forEach(function(f) {
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,' + f.opacity + ')';
        ctx.fill();
        f.y += f.speed;
        f.x += f.drift;
        if (f.y > canvas.height) { f.y = -5; f.x = Math.random() * canvas.width; }
        if (f.x > canvas.width) f.x = 0;
        if (f.x < 0) f.x = canvas.width;
      });
      requestAnimationFrame(drawSnow);
    }
    drawSnow();
  })();
</script>

</body>
