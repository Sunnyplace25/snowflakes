<script>
  var NOTE_ID = 'note_mada_1';
  var SECTIONS = [
        { heading: null, body: '「まだ、鳴っている」は、Snow flakesと、その周囲にいる人々を描いた9つの夏の短編です。\n\n起きることは、それぞれ違います。四拍目だけが来ない。叩いた音が返ってくる。電源を落としたはずなのに音が残る。誰もいないバーで氷が鳴る。鳴らす前の音が返ってくる。\n\nそして後半になると、怪異なのか、偶然なのか、人と人との距離が近すぎるだけなのか、その境界も少しずつ曖昧になっていきます。\n\n9話を通して残るのは、「終わったはずなのに、まだ何かが続いている」という感覚です。' },
        { heading: '第一夜「四拍目が来ない」', body: 'ライブハウスのリハーサル。コウタのイヤモニで、クリックが三つ鳴って止まります。カッ。カッ。カッ。四つ目が来ない。\n\nけれどハヤテもヒナタも、何事もなかったように演奏へ入る。誰も止まらない。誰も気づかない。コウタだけが、来なかった四拍目を待っています。\n\n最初に現れるのは、「聞こえてはいけない音」ではありません。「あるはずなのに、ない音」です。\n\n一度その欠落に気づいてしまうと、鳴っていない音まで意識するようになる。シリーズの違和感は、ここから始まります。' },
        { heading: '第二夜「叩き返すな」', body: 'ハヤテの前に現れるのは、自分のリズムを返してくる音。叩けば、同じように返ってくる。ドラマーなら、反射的にもう一度返したくなる。\n\nけれど、同じリズムを返してはいけない。ハヤテは、相手と同じものを返すのではなく、リズムを変えて先へ進みます。\n\n第一夜のコウタが「ない音を待ってしまった」のに対して、ハヤテは「来た音に付き合わない」。怪異への反応にも、三人それぞれの性格が出始めます。' },
        { heading: '第三夜「知らない音が鳴っている」', body: '誰もいないスタジオ。機材の電源を落としても、知らない音だけが残っています。消そうとしても、原因が分からない。\n\nヒナタはその音から離れるのではなく、ギターを持ち、六弦。五弦。四弦。と、一音ずつ重ねながら、知らない音の場所を探していきます。そして、「……そこか」と見つける。\n\nヒナタは、分からない音を拒絶するより、その横へ自分の音を置いてしまう人です。後の話まで続いていく、「知らないものへ合わせにいく」というヒナタの危うさが、最も分かりやすく出る一話でもあります。' },
        { heading: '第四夜「氷が呼ぶ」', body: '閉店後の、りんのバー。客はもういない。入口にも鍵がかかっている。それなのに、カラン。誰も座っていない席で、氷が鳴ります。\n\n現れたロックグラス。勝手に動くコースター。順番に鳴る酒の瓶。見えない客は、音だけで「いつもの一杯」を注文する。\n\nりんは逃げるのではなく、「一杯だけです」と言って酒を作ります。シェーカーを振るたび、誰もいない席の氷が、シャッ。カラン。と返事をする。客は、飲み終えると代金を置いて帰っていく。\n\n翌日には、グラスが二つに増えている。そこへ何も知らないハヤテが座り、「今の、俺じゃないよね」と氷の音に気づきます。\n\nこの話では、音はただの異変ではなく、「向こう側とのやり取り」になっています。最初は一人だった客が、なぜ二人になったのか。一度りんが客として迎えたことで、店を覚えられてしまったのか。それとも、氷の方が、次の客を呼んでいるのか。答えは最後まで分かりません。' },
        { heading: '第五夜「返しが先に鳴る」', body: '本来なら、音を出す、その音がモニターへ返ってくる、この順番です。けれど、まだ鳴らしていないはずの音が、先に返ってくる。原因を確認しても、機材の問題としてきれいには説明できない。\n\nさらに録音には、そこにあるはずのないものまで残ります。\n\n第一夜では、来るはずの音が来なかった。第五夜では逆に、まだ来るはずのない音が、先に来る。「音の順番」そのものが崩れ始めます。そして、誰が本物で、どちらが先なのか。時間と音の境界まで、少しずつ信用できなくなっていきます。' },
        { heading: '第六夜「怖」', body: '第六夜では、それまでの怪異とは少し違う種類の「怖さ」が描かれます。\n\nヒナタと朔。音楽を続けている人と、かつて音楽から離れた人。二人の間には、今鳴っている音だけではなく、過去に鳴っていた音、やめた音、それでも残っている音、そうした時間が重なっています。\n\nここで「怖」という言葉は、幽霊を見たときの怖さだけを指していません。選ばなかったもの。終わったと思っていたもの。もう戻らないと思っていた時間。そういうものが、ふと現在へ戻ってくることも、人にとっては「怖い」。\n\n前半五話が外から聞こえてくる奇妙な音を描いていたのに対して、ここから少しずつ、「人の中に残っている音」へ物語が移っていきます。' },
        { heading: '第七夜「一緒にいすぎてこわい」', body: '朝の楽屋。三人がそれぞれ、コンビニ袋を持ってやってきます。そして「せーの」で出してみると、全員、同じ鮭のおにぎり。同じメーカー。同じ商品。三人とも黙る。ハヤテが一言。「怖」\n\nさらにヒナタが、自分の袋からもう一つ商品を取り出します。\n\n怪異らしい怪異は、ほとんどありません。ただ、一緒にいる時間が長すぎて、選ぶものまで似てくる。次に何を言うか分かる。どう動くかも何となく分かる。それは三人にとって、安心できる関係でもあります。\n\nでも考えてみれば、他人なのに、そこまで揃うこと自体が少し怖い。それまでの話では、「揃ってしまう音」は異常でした。この話では、三人の間では、揃いすぎることが日常になっています。知らないものと揃うのか、知っている二人と揃うのか、それだけで意味がまったく変わります。' },
        { heading: '第八夜「もっとこわいこと」', body: '第八夜は、あかりの側から見た物語です。\n\nここまでのシリーズには、聞こえない音、知らない音、誰もいない場所に残る音、といった分かりやすい「怖さ」がありました。けれど、あかりの近くにあるのは、もっと普通のものです。\n\n誰かを好きになること。大切な人ができること。その人との時間が、自分の日常になっていくこと。\n\n幸せなものほど、失ったときのことを考えてしまう。だから、怪異よりも、幽霊よりも、大切なものができてしまうことの方が、「もっとこわいこと」なのかもしれない。\n\n第八夜は、シリーズの「怖い」という言葉を、怪異から人の感情へ完全に移す役割を持っています。なお、第八夜の公開タイトルは『もっとこわいこと』です。' },
        { heading: '第九夜「誰もいないアンコール」', body: 'そして最後に、物語はもう一度、はっきりとした怪異へ戻ります。\n\nライブは終わった。客も帰った。演奏も終わっている。それなのに、誰もいない会場から、アンコールを求める音がする。拍手。声。演奏の気配。そして、覚えのない「もう一曲」。\n\n第一夜では、来なかった一拍を待っていました。最後の第九夜では、終わったものの方が、続きを要求してきます。\n\nここまでに出てきた、足りない音、返る音、残る音、先に鳴る音、揃う音、それらが最後に、「終わってくれない音」として戻ってきます。' },
        { heading: '前半と後半', body: '9話は、大きく見ると少し構造が変わっています。\n\n前半では、音がおかしいという現象そのものが中心です。四拍目がない。音が返る。知らない音が鳴る。氷が返事をする。返しが先に来る。\n\nところが後半になるにつれて、「怖いとは何なのか」という話に変わっていきます。過去が残ること。一緒にいすぎること。誰かを大切に思うこと。そして最後にもう一度、本物の怪異が戻ってくる。\n\nだから『まだ、鳴っている』は、単純に9種類の怖い音を並べた話ではありません。' },
        { heading: '三人と「音」', body: '同じような異変が起きても、三人の反応は違います。コウタは、違和感を認識して、理由を考える。ハヤテは、止まるより先へ動く。ヒナタは、分からないものへ近づき、自分の音を合わせようとする。\n\nこれは普段の三人の音楽の作り方とも重なっています。ヒナタは感情を置く。コウタは整理する。ハヤテはそのまま動かす。三人の役割は、怪異に出会ったときにも変わりません。' },
        { heading: '「まだ、鳴っている」とは', body: 'タイトルの「まだ」は、単純に、今も音が鳴っているという意味ではありません。\n\n終わったはずなのに。消したはずなのに。忘れたはずなのに。気のせいにしたはずなのに。それでも、何かが残っている。耳に残る。身体に残る。記憶に残る。人との間に残る。\n\n一度鳴ったものは、音が止まったあとにも、その人を少しだけ変えます。\n\nSnow flakesそのものも、音楽を「特別な出来事」ではなく、三人が一緒にいる形として続けてきた物語です。だからこの9話で描かれているのも、「消えない怪異」だけではありません。一度そこにあったものが、簡単にはなくならないこと。' },
        { heading: '9つの夏の音', body: '第一夜では、来ない音を待つ。第二夜では、返ってきた音へ同じ返事をしない。第三夜では、知らない音の横へ自分の音を置く。第四夜では、音だけの客を迎える。第五夜では、未来の音が先に返ってくる。\n\n第六夜では、過去の音が現在へ残る。第七夜では、一緒にいすぎて三人が揃う。第八夜では、大切なものができることそのものが怖くなる。\n\nそして第九夜では、終わったはずの音が、「もう一曲」を求める。\n\n9つの話に共通しているのは、音が鳴ったことではありません。一度そこにあったものが、きれいには消えてくれないこと。音は、消えたはずなのに。まだ、どこかで鳴っている。' },
      ];
  document.addEventListener('DOMContentLoaded', function() {
    if (typeof SfSnow === 'undefined') return;
    if (!SfSnow.isUnlocked(NOTE_ID)) {
      document.getElementById('locked-view').style.display = '';
      document.getElementById('content-view').style.display = 'none';
      return;
    }
    document.getElementById('locked-view').style.display = 'none';
    document.getElementById('content-view').style.display = 'block';
    var bodyEl = document.getElementById('note-body');
    var html = '';
    SECTIONS.forEach(function(sec) {
      if (sec.heading) {
        html += '<p class="section-heading">&#9632; ' + sec.heading + '</p>';
        html += '<p class="section-spacer">　</p>';
      }
      sec.body.split('\n').forEach(function(line) {
        html += '<p>' + (line === '' ? '　' : line) + '</p>';
      });
      html += '<p class="section-spacer">　</p>';
    });
    bodyEl.innerHTML = html;
  });
  (function() {
    var canvas = document.getElementById('snow');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);
    var flakes = [];
    for (var i = 0; i < 70; i++) {
      flakes.push({ x:Math.random()*window.innerWidth, y:Math.random()*window.innerHeight, r:Math.random()*2+0.5, speed:Math.random()*0.5+0.2, drift:(Math.random()-0.5)*0.3, opacity:Math.random()*0.5+0.2 });
    }
    function drawSnow() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      flakes.forEach(function(f) {
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,255,255,'+f.opacity+')'; ctx.fill();
        f.y += f.speed; f.x += f.drift;
        if (f.y > canvas.height) { f.y = -5; f.x = Math.random()*canvas.width; }
        if (f.x > canvas.width) f.x = 0;
        if (f.x < 0) f.x = canvas.width;
      });
      requestAnimationFrame(drawSnow);
    }
    drawSnow();
  })();
</script>
