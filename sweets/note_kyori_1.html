<script>
  var NOTE_ID    = 'note_kyori_1';
  var ITEM_ID    = 'spinel_book';
  var SCROLL_KEY  = 'sf_note_scroll_' + ITEM_ID;
  var REWARD_KEY  = 'sf_note_reward_' + NOTE_ID;

  var _charaPending = false;
  var _rewardFired  = false;

  function closeItemPopup() {
    document.getElementById('item-popup').classList.remove('show');
    if (!_charaPending) return;
    _charaPending = false;
    setTimeout(function() { _showCharaPopup(); }, 350);
  }

  function _showCharaPopup() {
    var popup  = document.getElementById('chara-popup');
    var nameEl = document.getElementById('chara-name');
    var faceEl = document.getElementById('chara-face');
    nameEl.style.color = '#fca5a5';
    nameEl.textContent = 'KOUTA';
    faceEl.src = '../plofile/chibi_kouta.webp';
    popup.classList.add('show');
    setTimeout(function() { popup.classList.remove('show'); }, 3000);
  }

  document.addEventListener('DOMContentLoaded', function() {
    if (typeof SfSnow === 'undefined') return;

    if (!SfSnow.isUnlocked(NOTE_ID)) {
      document.getElementById('locked-view').style.display = '';
      document.getElementById('content-view').style.display = 'none';
      return;
    }

    document.getElementById('locked-view').style.display = 'none';
    document.getElementById('content-view').style.display = 'block';

    // アイテムバッジ
    var badge      = document.getElementById('item-badge');
    var badgeImg   = document.getElementById('item-badge-img');
    var badgeLabel = document.getElementById('item-badge-label');
    var itemGot    = SfSnow.isUnlocked(ITEM_ID);
    badge.style.display = 'inline-flex';
    if (itemGot) {
      badgeImg.style.filter  = 'none';
      badgeImg.style.opacity = '0.85';
      badgeLabel.textContent = '赤い石が嵌め込まれた古書';
      badgeLabel.style.color = '#fca5a5';
    } else {
      badgeImg.style.filter  = 'grayscale(1)';
      badgeImg.style.opacity = '0.45';
      badgeLabel.textContent = 'アイテムあり';
    }

    var sections = [
      { heading: null, body: '「正しい距離より、触れている方がいい」は、Snow flakes本編の外側にある、夢の中の一篇です。\n\n舞踏会。\n玉座。\n黒髪の姫。\n金髪の王子。\n整えられた庭。\n\n現実とは違う場所で、ヒナタは「正しい距離」を見ます。\n\nそれは綺麗で、間違っていなくて、誰にも乱されていない距離です。\nけれどヒナタには、そこに小さな違和感が残る。\n\nちゃんとしている。\nでも、遠い。\n\nこの話は、その違和感を追いかけていく物語です。' },
      { heading: '夢の中でも、ヒナタはヒナタのまま', body: 'ヒナタは、夢の中で陛下になっています。\n\nけれど、立場が変わっても、ヒナタ自身はほとんど変わりません。\n\n礼儀や順序を理解して動くのではなく、\n見たものに対して、まっすぐ反応する。\n\n「ちゃんとしてる」\n「でも遠い」\n「触れてない」\n\n言葉は少ない。\nけれど、核心だけは外さない。\n\n夢の中の世界は、すべてが整っています。\n音楽も、人の動きも、立ち位置も、距離も。\n\nその中でヒナタだけが、整っているものの中にある違和感を見つけてしまいます。' },
      { heading: 'ハヤテ王子の正しい距離', body: '夢の中のハヤテは、金髪の王子として現れます。\n\n姿勢も、言葉も、手の取り方も、すべてが整っている。\n\n相手を乱さない。\n踏み込みすぎない。\n場を壊さない。\n\nそれは、間違っていない距離です。\n\nハヤテの距離は、優しくて、正しい。\n誰かを傷つけないための距離でもあります。\n\nだからヒナタは、最初に「ちゃんとしてる」と感じます。\n\nけれど、ちゃんとしているからこそ、届かないものがある。\n\nここで描いているのは、ハヤテの距離が間違っているということではありません。\n正しいからこそ遠くなるものがある、ということです。' },
      { heading: 'リトルスノーという名前', body: '黒髪の姫は、リトルスノーと呼ばれます。\n\nヒナタはその名前を聞いて、すぐに「合ってる」と言います。\n理由を説明できるわけではありません。\n\nけれどヒナタにとって、名前は理屈より先に届くものです。\n\n黒髪。\n静かな立ち方。\n雪のような名前。\n\nその名前が合っていると思った瞬間、ヒナタの中で彼女の輪郭が少しだけはっきりします。\n\nだから、見続けてしまう。\nただ綺麗だからではなく、その距離が本当に彼女に届いているのかを、気にしてしまう。\n\nリトルスノーという呼び名は、夢の中で彼女の輪郭を決めるものでもあります。\n\nそこから、物語が少しずつ動き始めます。' },
      { heading: '「あの距離で、いいの」', body: '庭でヒナタは、リトルスノーに問いかけます。\n\n「嫌じゃないの」\n「あの距離で、いいの」\n\nこれは、答えを迫る言葉ではありません。\n\nヒナタが気にしているのは、距離です。\n\n正しい距離。\n綺麗な距離。\n誰にも責められない距離。\n\nその距離の中で、本当に息ができるのか。\n本当に届いているのか。\n\nヒナタは、それを確かめようとしています。\n\nだからこれは、誰かを選ぶ話ではなく、\n「届く距離とは何か」を見る話です。' },
      { heading: '「触れてない」', body: 'お茶会の場面で、ヒナタははっきり言います。\n\n「ちゃんとしてるけど」\n「触れてない」\n\nこの言葉が、物語の中心です。\n\nハヤテの所作は正しい。\nリトルスノーとの距離も美しい。\nけれどヒナタには、そこに「触れていない」感覚がある。\n\nここでいう「触れる」は、単に手に触れることではありません。\n\n相手の呼吸に届くこと。\n揺れに気づくこと。\n断れる余地を残すこと。\n正しさより先に、その人自身へ届くこと。\n\nだからヒナタは、同じ形をなぞるのではなく、同じ距離へ向かおうとします。' },
      { heading: '「嫌なら、断ってもいい」', body: 'ヒナタがリトルスノーの手を取った時、その距離は近いです。\n\n手順としては綺麗ではない。\n王子の所作のように整ってもいない。\n\nけれど同時に、ヒナタはこう言います。\n\n「嫌なら、断ってもいい」\n\nこの一言で、ヒナタの距離はただの踏み込みではなくなります。\n\n近い。\nけれど、相手が拒める余地は残している。\n\nそれは、正しい礼儀とは違う形の配慮です。\n\nハヤテの距離は、乱さないための距離。\nヒナタの距離は、届くための距離。\n\nどちらが正しいかを決める話ではありません。\nただ、その違いがリトルスノーの中に残ってしまう。\n\nだから彼女は、あとで「ずるい」と呟きます。' },
      { heading: 'ハヤテが見抜かれるもの', body: 'この話の中で、ハヤテは誰よりも正しく立っています。\n\n王子として、相手を乱さず、場を崩さず、綺麗に距離を保っている。\n\nだからこそ、ヒナタの「触れてない」という言葉は刺さります。\n\nそれは否定ではなく、見抜かれた感覚に近い。\n\nハヤテ自身も、自分の距離が遠かったことに気づく。\nけれど、それでも崩れない。\n\n「面白い」と呟くハヤテには、余裕と、悔しさと、少しの興味が混ざっています。\n\nここで変わるのは、誰かの答えではありません。\n三人それぞれの「距離の取り方」です。' },
      { heading: 'コウタは距離を整理する', body: '夢の中のコウタは、参謀役として現れます。\n\nヒナタが感覚で見つけたものを、コウタは言葉にしようとする。\n\nただし、全部を説明するわけではありません。\n\nコウタは、ヒナタが何に触れようとしているのかを見ています。\n\nハヤテとリトルスノーの間にある、正しい距離。\nそこへヒナタが無自覚に触れていく。\n\nコウタはそれを止めない。\nむしろ、少し面白がっている。\n\nそれは、ヒナタがまた何かの核心に触れ始めたことを見ているからです。' },
      { heading: '現実に戻る', body: '最後にヒナタは、スタジオで目を覚まします。\n\nアンプの唸り。\nドラムのチェック音。\nスティックの跳ね返り。\n\n舞踏会の音は消えて、いつものSnow flakesの音が戻ってくる。\n\nそこでヒナタは、現実のハヤテを見る。\n夢の中の王子ではない、いつものハヤテ。\n\n夢の距離感を少しだけ引きずったまま、ヒナタはハヤテの手に触れてしまう。\n\nそれは、夢の続きを現実に持ち込んだような行動です。\nけれど同時に、夢が現実へ戻っていくための合図でもあります。\n\n「王子じゃないな」\n「夢でよかった」\n\nその言葉で、重くなりすぎた夢は、いつもの三人の空気へ戻っていきます。' },
      { heading: '正しい距離より、触れている方がいい', body: 'この話に出てくる「正しい距離」は、悪いものではありません。\n\n相手を守るための距離。\n踏み込みすぎないための距離。\n場を壊さないための距離。\n\nそれは必要なものです。\n\nけれど、正しい距離だけでは届かないこともある。\n\n触れないまま守ること。\n触れてしまうことで届くこと。\n\nそのどちらも、簡単には否定できません。\n\nヒナタは、正しさより先に「届いているか」を見てしまう。\nハヤテは、届きすぎないように正しさを保つ。\nリトルスノーは、その二つの距離の違いに気づいてしまう。\nコウタは、それが変わっていく瞬間を見ている。\n\n正しいのに遠いもの。\n不器用なのに届いてしまうもの。\n触れないことで守られるもの。\n触れることで変わってしまうもの。\n\n夢から覚めたあとも、\nその感覚だけが、少しだけ音の中に残っています。' },
    ];

    var bodyEl = document.getElementById('note-body');
    var html = '';
    sections.forEach(function(sec) {
      if (sec.heading) {
        html += '<p class="section-heading">■ ' + sec.heading + '</p>';
        html += '<p class="section-spacer">\u3000</p>';
      }
      sec.body.split('\n').forEach(function(line) {
        html += '<p>' + (line === '' ? '\u3000' : line) + '</p>';
      });
      html += '<p class="section-spacer">\u3000</p>';
    });
    bodyEl.innerHTML = html;

    // スクロール読了でアイテム付与 / 再読了でポップアップのみ
    var alreadyScrolled = !!localStorage.getItem(SCROLL_KEY);
    var sentinel = document.getElementById('scroll-sentinel');
    if (sentinel && !alreadyScrolled) {
      var obs = new IntersectionObserver(function(entries) {
        if (!entries[0].isIntersecting) return;
        if (_rewardFired) return;
        _rewardFired = true;
        obs.disconnect();
        localStorage.setItem(SCROLL_KEY, '1');
        localStorage.setItem(REWARD_KEY, '1');
        var alreadyGot = SfSnow.isUnlocked(ITEM_ID);
        if (!alreadyGot) {
          SfSnow.unlockItem(ITEM_ID);
          badgeImg.style.filter  = 'none';
          badgeImg.style.opacity = '0.85';
          badgeLabel.textContent = '赤い石が嵌め込まれた古書';
          badgeLabel.style.color = '#fca5a5';
          document.getElementById('popup-msg').textContent = 'を入手しました';
        } else {
          document.getElementById('popup-msg').textContent = 'は入手済みです';
        }
        _charaPending = true;
        setTimeout(function() {
          document.getElementById('popup-label').style.color = '#fca5a5';
          document.getElementById('item-popup').classList.add('show');
        }, 1000);
      }, { threshold: 1.0 });
      obs.observe(sentinel);
    }
  });

  (function() {
    var canvas = document.getElementById('snow');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);
    var flakes = [];
    for (var i = 0; i < 70; i++) {
      flakes.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        r: Math.random() * 2 + 0.5,
        speed: Math.random() * 0.5 + 0.2,
        drift: (Math.random() - 0.5) * 0.3,
        opacity: Math.random() * 0.5 + 0.2
      });
    }
    function drawSnow() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      flakes.forEach(function(f) {
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,' + f.opacity + ')';
        ctx.fill();
        f.y += f.speed;
        f.x += f.drift;
        if (f.y > canvas.height) { f.y = -5; f.x = Math.random() * canvas.width; }
        if (f.x > canvas.width) f.x = 0;
        if (f.x < 0) f.x = canvas.width;
      });
      requestAnimationFrame(drawSnow);
    }
    drawSnow();
  })();
</script>
