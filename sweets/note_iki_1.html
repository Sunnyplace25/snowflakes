<script>
  var NOTE_ID = 'note_iki_1';
  var SECTIONS = [
        { heading: null, body: '「閾値」は、音響技術者の女性を主人公にした短編です。\n\n波形。スペクトラム。基準トーン。規定値。\n\n彼女にとって音は、測定し、確認し、制御できるものでした。だから最初の言葉は、「越えなければ、音ではない。」\n\nけれど物語が進むにつれて、その前提そのものが崩れていきます。' },
        { heading: '「閾値」とは', body: '閾値とは、ある変化が起きる境目のことです。\n\nこの作品では最初、「ここを越えたら音として扱う」「越えなければ問題ではない」という、音を判断するための境界として登場します。\n\n主人公はその境界を信じています。\n\n波形に出ない。スペクトラムも変わらない。規定値も守られている。ならば、そこには何もない。\n\nそのはずでした。' },
        { heading: '0:42', body: '異変が起きるのは、無音部分の0:42付近。\n\n音が鳴るわけではありません。波形も動かない。ただ、空気が内側へ寄る。喉の奥が冷える。ヘッドホンの奥で、圧がわずかに変わる。\n\n最初は偶然に見えます。\n\nけれど、違うスタジオ。違うマイク。違う素材。それでも同じ場所で起きる。\n\n音響技術者である彼女にとって、「再現できる」ということは、無視しにくい事実になっていきます。' },
        { heading: '数値は正しい', body: '主人公は、感覚より数値を信じる人です。\n\n高校時代、音楽を演奏することには馴染めなかった。人の気分で揺れるテンポや強弱より、決めた位置で止まるフェーダー。測定できるノイズ。確認できる位相。そういうものの方が、彼女には信頼できた。\n\nだから怖いのは、機材が壊れることではありません。\n\n機材が正常なのに、自分だけが何かを感じていることです。\n\n数値が間違っているなら直せる。でも、数値が正しいまま、自分の感覚だけが変わってしまったら。\n\n直す場所がありません。' },
        { heading: '「何もない」', body: '彼女は、自分以外の人にも確認してもらいます。けれど返ってくるのは、「何もない」という答え。\n\n本当に聞こえていない。嘘でも、気づいていないふりでもない。\n\nそのことに、彼女は少し安心します。そして同時に、少し怖くなる。\n\nもし全員に聞こえているなら、それは外側にあるものかもしれない。でも、自分にしか分からないなら。\n\n変わったのは、外側ではなく自分なのかもしれない。' },
        { heading: '「音が越えたのではない」', body: '最後に彼女は、外界から音を遮断した無音室で確認します。\n\n波形は完全な直線。規定値も正常。それでも0:42で、同じ感覚がある。\n\nそこで、彼女は理解します。\n\n「音が越えたのではない。\n　私が越えたのだ。」\n\nこの一文が、タイトル「閾値」の本当の意味です。\n\n何かが大きくなって、彼女に届くようになったのではない。彼女自身が、今まで感じなくてよかった領域へ踏み込んでしまった。\n\n境界線の向こう側へ移ったのは、音ではなく、人間の方でした。' },
        { heading: '「慣れただけ」', body: 'その後も、彼女の生活は普通に続きます。\n\n仕事もできる。判断も正確。ノイズも処理できる。0:42も、以前ほど怖くはありません。\n\nけれど、消えたわけではない。\n\n「慣れただけ」。\n\nここは、この作品の静かな怖さのひとつです。\n\n怪異を倒したわけでもない。原因を突き止めたわけでもない。ただ、異常のある世界で生活することに、人間の方が適応してしまった。' },
        { heading: '最後の波形', body: '物語の最後。\n\nずっと平らだったタイムラインの直線が、わずかに揺れます。\n\nけれど、規定値内。自動処理の対象外。誰も気づかない。\n\nそして最後まで、「規定値は、守られている。」\n\n数値の上では、何も起きていません。けれど最初と最後では、この言葉の意味が変わっています。\n\n冒頭では、規定値を越えなければ安全だった。最後では、規定値を越えなくても、何かは存在できる。\n\n測定できないことと、存在しないことは同じではない。\n\nその可能性だけが残ります。' },
        { heading: '「閾値」が描いているもの', body: '「閾値」は、聞こえてはいけない音を聞く話ではありません。\n\nもっと正確には、「今まで認識できなかったものを、認識できる側へ移ってしまう話」です。\n\n一度知覚してしまえば、知らなかった頃には戻れない。\n\nだから主人公は、最後まで正常です。仕事もできる。数値も読める。生活も続いている。\n\nただ、世界の中にあるものが、以前よりひとつだけ多く見えている。\n\nそれだけです。' },
        { heading: '夏の音の入口', body: '夏のSnow flakesで描かれる「音」は、必ずしも聞こえるものだけではありません。\n\n波形に出ないもの。消えたはずの音。数えると合わない音。誰かにだけ聞こえる音。\n\n「閾値」は、その夏の最初に置かれた境界線です。\n\n越えなければ、音ではない。\n\nでは、越えたのが音ではなく、聞いている人の方だったら。\n\nそこから、この夏の「音」の物語が始まります。' },
      ];
  document.addEventListener('DOMContentLoaded', function() {
    if (typeof SfSnow === 'undefined') return;
    if (!SfSnow.isUnlocked(NOTE_ID)) {
      document.getElementById('locked-view').style.display = '';
      document.getElementById('content-view').style.display = 'none';
      return;
    }
    document.getElementById('locked-view').style.display = 'none';
    document.getElementById('content-view').style.display = 'block';
    var bodyEl = document.getElementById('note-body');
    var html = '';
    SECTIONS.forEach(function(sec) {
      if (sec.heading) {
        html += '<p class="section-heading">&#9632; ' + sec.heading + '</p>';
        html += '<p class="section-spacer">　</p>';
      }
      sec.body.split('\n').forEach(function(line) {
        html += '<p>' + (line === '' ? '　' : line) + '</p>';
      });
      html += '<p class="section-spacer">　</p>';
    });
    bodyEl.innerHTML = html;
  });
  (function() {
    var canvas = document.getElementById('snow');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);
    var flakes = [];
    for (var i = 0; i < 70; i++) {
      flakes.push({ x:Math.random()*window.innerWidth, y:Math.random()*window.innerHeight, r:Math.random()*2+0.5, speed:Math.random()*0.5+0.2, drift:(Math.random()-0.5)*0.3, opacity:Math.random()*0.5+0.2 });
    }
    function drawSnow() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      flakes.forEach(function(f) {
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,255,255,'+f.opacity+')'; ctx.fill();
        f.y += f.speed; f.x += f.drift;
        if (f.y > canvas.height) { f.y = -5; f.x = Math.random()*canvas.width; }
        if (f.x > canvas.width) f.x = 0;
        if (f.x < 0) f.x = canvas.width;
      });
      requestAnimationFrame(drawSnow);
    }
    drawSnow();
  })();
</script>
