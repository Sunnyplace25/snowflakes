    ['みんなの話し合いが、止まってしまった。', [['しばらく様子を見る', 'M2U1'], ['ひとつ案を出して、話を前に進める', 'D2H1'], ['出ている意見をまとめ直す', 'S2T1'], ['話題を変えて、空気をゆるめる', 'F2G1']]],
    ['友だちが落ち込んでいる。', [['何も聞かずに、そばにいる', 'M2T1'], ['好きそうなものを持って会いに行く', 'W2T1'], ['気分転換に連れ出す', 'D2H1'], ['話を最後まで聞く', 'U2S1']]],
    ['引っ越しで、荷物を減らすことになった。', [['思い出の物は残して、ほかを減らす', 'K2I1'], ['基準を決めて、迷わず仕分ける', 'S2R1'], ['思い切って、ほとんど手放す', 'H2F1']]],
    ['初めて入った店。メニューが多すぎる。', [['ピンときたものにする', 'G2F1'], ['店の人におすすめを聞く', 'T2W1'], ['いつも頼むものに近いものを選ぶ', 'K2M1'], ['全部見てから決める', 'S2I1']]],
    ['夜、なかなか眠れない。', [['昔の写真を見返す', 'K2I1'], ['明日の予定を書き出す', 'S2R1'], ['外に出て、少し歩く', 'D2F1'], ['誰かに「起きてる？」と送る', 'T2W1']]],
    ['頼まれてはいないけれど、直せそうなことに気づいた。', [['黙って直しておく', 'D2I1'], ['「こうしたらどう？」と伝える', 'W2T1'], ['本人が気づくまで待つ', 'M2U1']]],
    ['旅行の行き先を決める。', [['前に行って良かった場所に、もう一度', 'K2M1'], ['まだ行ったことのない場所', 'H2F1'], ['一緒に行く人が行きたい場所', 'U2T1'], ['日程と予算から、いちばん合う所', 'S2R1']]],
    ['好きだった店が、閉店すると知った。', [['最後にもう一度、ひとりで行く', 'K2I1'], ['お店の人に「ありがとう」を伝えに行く', 'T2W1'], ['新しいお気に入りを探しはじめる', 'H2D1']]],
    ['約束の日。出発まで少し時間があるけれど、いつもより疲れている。', [['約束した時間に、予定どおり向かう', 'R2K1'], ['相手に相談して、会い方を一緒に決める', 'T2S1'], ['少し休んでから、その日の気分に合う過ごし方を考える', 'G2F1']]],
    ['誰かの秘密を、知ってしまった。', [['誰にも言わず、胸にしまう', 'I2K1'], ['本人にそっと伝える', 'W2T1'], ['本人が話すまでは、いつも通り接する', 'U2M1']]],
    ['新しいことを始めたい。でも時間がない。', [['今あることをひとつやめて始める', 'H2S1'], ['とりあえず今日、5分だけやってみる', 'D2G1'], ['時間ができるまで、大事に取っておく', 'K2M1'], ['計画を立ててから始める', 'S2R1']]],
    ['知らない人ばかりの集まりに来た。', [['少し離れて、全体を眺める', 'M2I1'], ['ひとりでいる人に話しかける', 'W2T1'], ['気の向くまま、会場を歩き回る', 'F2G1']]],
    ['大事なことを、決めなければいけない。', [['自分の気持ちが固まるまで待つ', 'I2G1'], ['信頼できる人に相談する', 'T2U1'], ['理由を言えるほうを選ぶ', 'S2R1'], ['あまり考えすぎず、まず決めてみる', 'D2H1']]],
    ['帰り道、雪が降ってきた。', [['立ち止まって、しばらく眺める', 'M2G1'], ['少し遠回りして歩く', 'D2F1'], ['誰かに写真を送る', 'T2W1'], ['明日の電車が動くか調べる', 'R2S1']]],
    ['誰かと、意見がぶつかった。', [['相手の考えを、一度受け止める', 'U2M1'], ['自分の考えを、はっきり伝える', 'W2S1'], ['一晩置いて、自分の気持ちを確かめる', 'I2K1'], ['お互いが納得できる形を探す', 'T2R1']]],
    ['帰り道に、知らない道を見つけた。', [['入ってみる', 'F2H1'], ['いつもの道で帰る', 'K2M1'], ['今度、誰かと一緒に来ようと思う', 'T2M1']]],
    ['仲間が「もうやめたい」と言った。', [['理由を最後まで聞く', 'U2S1'], ['続ける方法がないか、一度だけ聞いてみる', 'W2K1'], ['その人が選んだことなら、と送り出す', 'F2U1'], ['抜けたあとのことを考えて動く', 'R2S1']]],
    ['手紙を書くことになった。', [['書いては消して、時間をかけて書く', 'I2S1'], ['思いついたことを、そのまま書く', 'G2F1'], ['相手が読みやすいように整えて書く', 'S2T1']]],
    ['大切な人が、遠くへ行くことになった。', [['笑って送り出す', 'U2F1'], ['離れても、変わらず連絡を取り続けようと思う', 'K2T1'], ['会いに行く方法を考える', 'D2T1'], ['自分も何か始めようと思う', 'H2I1']]],
    ['頼りにされて、やることが増えてきた。', [['引き受けた以上は、最後までやる', 'R2S1'], ['誰かに手伝いを頼む', 'T2W1'], ['本当にやりたいことか、考え直す', 'F2I1']]],
    ['いつも静かな友だちが、今日はよく話している。', [['話の続きを、黙って聞く', 'U2M1'], ['「今日は楽しそうだね」と声をかける', 'W2T1'], ['こちらからは触れず、いつも通り過ごす', 'M2K1'], ['何があったのか、少し考えてみる', 'S2I1']]],
    // ── 見分け用：前へ進めたい（D）／枠から外れたい・揺らしたい（W）
    ['決まったやり方で進めるように言われた。', [['まずその通りに進めて、やりながら良くしていく', 'D2H1'], ['「そもそも、どうしてこのやり方なんだろう」と聞いてみる', 'W2F1'], ['決まりの中で、いちばん良い形を探す', 'S2R1']], 'dw'],
    ['みんなが「いいね」と言っている案に、少しだけ違和感がある。', [['その違和感を、思い切って口にしてみる', 'W2G1'], ['決まったなら、早く形にする方に力を使う', 'D2G1'], ['みんなの気持ちを、先に聞いてみる', 'U2T1'], ['静かに覚えておいて、あとで考える', 'I2M1']], 'dw'],
    ['毎日が、同じことの繰り返しに感じてきた。', [['新しい目標を決めて、動き出す', 'D2H1'], ['いつもの決まりごとを、わざと崩してみる', 'W2F1'], ['繰り返しの中にある、変わらない良さを探す', 'K2M1']], 'dw'],
    ['仲間が「このままでいい」と言っている。でも、何か足りない気がする。', [['「本当にそう思ってる？」と、本音を聞いてみる', 'W2G1'], ['足りない分を、自分が動いて埋める', 'D2H1'], ['みんなが納得しているなら、いったんその形を受け入れる', 'U2T1'], ['何が足りないのか、ひとりで整理する', 'S2I1']], 'dw'],
    // ── 見分け用：そばに居続ける（K）／気持ちをそのまま受け止めて整える（S）
    ['しばらく連絡のなかった友だちから、急に連絡が来た。', [['前と変わらない調子で、すぐに返す', 'K2T1'], ['何かあったのかもしれないと、話を聞く準備をする', 'U2S1'], ['会う約束を、すぐに決める', 'D2T1'], ['落ち着いてから、ゆっくり返す', 'I2M1']], 'ks'],
    ['友だちが、あなたとは違う道を選んだ。', [['道が違っても、これまで通りそばにいる', 'K2T1'], ['その人が決めたことを、そのまま受け止める', 'U2S1'], ['気になることだけ、正直に伝える', 'W2S1'], ['自分も、自分の道を考えはじめる', 'H2I1']], 'ks'],
    ['誰かが、泣きながら話している。', [['落ち着くまで、何も言わずに隣にいる', 'K2M1'], ['言葉をさえぎらず、最後まで聞く', 'U2S1'], ['温かい飲み物を用意してくる', 'W2T1'], ['何ができるか、一緒に考える', 'S2T1']], 'ks']
  ];

  var app = document.getElementById('app');

  // ── あなたの音（波）：答えた選択肢のいちばん強い性質の色で、波が1本ずつ重なっていく ──
  var Wave = (function () {
    var cv = document.getElementById('wave'), cx = cv.getContext('2d'), layers = [], mode = 'idle', target = null, t0 = 0, raf = 0;
    var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var COL = { K: '#93c5fd', H: '#fde68a', M: '#e2e8f0', D: '#fdba74', I: '#c4b5fd', T: '#fca5a5', U: '#a5b4fc', W: '#f9a8d4', F: '#cbd5e1', R: '#a7f3d0', G: '#fef3c7', S: '#bae6fd' };
    var ORDER = 'KHMDITUWFRGS';
    function size() { var r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1; cv.width = r.width * d; cv.height = r.height * d; cx.setTransform(d, 0, 0, d, 0, 0); }
    function draw(now) {
      var w = cv.clientWidth, h = cv.clientHeight, t = (now - t0) / 1000;
      cx.clearRect(0, 0, w, h);
      cx.globalCompositeOperation = 'lighter';
      var pulse = mode === 'listen' ? 1 + 0.35 * Math.sin(t * 5) : 1;
      // 何も答えていないときの、かすかな線
      cx.strokeStyle = 'rgba(255,255,255,0.18)'; cx.lineWidth = 1; cx.beginPath(); cx.moveTo(0, h / 2); cx.lineTo(w, h / 2); cx.stroke();
      layers.forEach(function (L, n) {
        var grow = Math.min(1, (now - L.born) / 900), amp = L.amp * grow * pulse * (h / 2 - 8);
        cx.strokeStyle = target || L.col; cx.globalAlpha = 0.55; cx.lineWidth = 1.6;
        cx.beginPath();
        for (var x = 0; x <= w; x += 4) {
          var e = Math.sin(Math.PI * x / w);   // 両端は静かに
          var y = h / 2 + Math.sin(x / w * Math.PI * L.f + t * L.sp + L.ph) * amp * e;
          x ? cx.lineTo(x, y) : cx.moveTo(x, y);
        }
        cx.stroke();
      });
      cx.globalAlpha = 1; cx.globalCompositeOperation = 'source-over';
      if (!still) raf = requestAnimationFrame(draw);
    }
    return {
      show: function () { cv.hidden = false; size(); cancelAnimationFrame(raf); t0 = performance.now(); raf = requestAnimationFrame(draw); },
      hide: function () { cv.hidden = true; cancelAnimationFrame(raf); },
      reset: function () { layers = []; mode = 'idle'; target = null; },
      add: function (code) {
        var m = code.match(/([A-Z])(\d)/), k = m ? m[1] : 'M', i = ORDER.indexOf(k);
        layers.push({ col: COL[k] || '#fff', f: 2 + i % 6 + layers.length * 0.35, amp: 0.25 + 0.06 * (+m[2] || 1) + Math.random() * 0.12, sp: 0.8 + Math.random() * 1.2, ph: Math.random() * 6, born: performance.now() });
        if (still) draw(performance.now());
      },
      listen: function () { mode = 'listen'; },
      settle: function (col) { mode = 'idle'; target = col; if (still) draw(performance.now()); }
    };
  })();
  window.addEventListener('resize', function () { if (!document.getElementById('wave').hidden) Wave.show(); });
  // 途中の一言（4 問目・8 問目のあと）
  var BETWEEN = { 4: '音が、少しずつ形になってきた。', 8: 'もう少しで、聴こえそう。' };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); };
  var shuffle = function (a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
  var parse = function (code) { var o = {}; code.replace(/([A-Z])(\d)/g, function (_, k, n) { o[k] = (o[k] || 0) + +n; }); return o; };
  function vecOf(pts) { return AXES.map(function (ax) { return (pts[ax[0]] || 0) - (pts[ax[1]] || 0); }); }
  function typeVec(t) { var o = {}; t.base.split('').forEach(function (k) { o[k] = 1; }); return vecOf(o); }
  function cos(a, b) { var d = 0, x = 0, y = 0; for (var i = 0; i < a.length; i++) { d += a[i] * b[i]; x += a[i] * a[i]; y += b[i] * b[i]; } return x && y ? d / Math.sqrt(x * y) : 0; }

  var qs, idx, pts;
  function start() {
    // 見分け用の質問（dw・ks）を 2 問ずつ必ず入れて、残りはそれ以外から。並びと選択肢の順も毎回変える
    var of = function (tag) { return shuffle(Q.filter(function (q) { return q[2] === tag; })); };
    qs = shuffle(of('dw').slice(0, 2).concat(of('ks').slice(0, 2), shuffle(Q.filter(function (q) { return !q[2]; })).slice(0, ASK - 4)))
      .map(function (q) { return [q[0], shuffle(q[1])]; });
    idx = 0; pts = {};
    Wave.reset(); Wave.show();
    ask();
  }
  function intro() {
    app.innerHTML = '<p class="label">YOUR SOUND</p><h1>あなたの音診断</h1>' +
      '<p class="lead">今のあなたは、どんな音を持っているか。<br>日常の場面で、近いほうを選んでください。<br>正解はありません。</p>' +
      '<p class="lead" style="font-size:12px;margin-top:16px;">全' + ASK + '問・質問は毎回少し変わります</p>' +
      '<button class="btn" type="button" id="go">はじめる</button>';
    Wave.hide();
    document.getElementById('go').onclick = start;
  }
  function ask() {
    var q = qs[idx];
    app.innerHTML = '<div class="progress"><span style="width:' + (idx / ASK * 100) + '%"></span></div>' +
      '<p class="between">' + (BETWEEN[idx] || '') + '</p>' +
      '<div class="fade"><p class="q-no">' + (idx + 1) + ' / ' + ASK + '</p><p class="q-text">' + esc(q[0]) + '</p>' +
      '<div class="opts">' + q[1].map(function (o, i) { return '<button class="opt" type="button" data-i="' + i + '">' + esc(o[0]) + '</button>'; }).join('') + '</div>' +
      '<p class="note">いちばん近いものを、ひとつ</p></div>';
    // 連打の防止：出てから 0.4 秒は押せない。押したら選んだものだけ光らせて、ほかは消してから次へ
    var ready = false, shownAt = Date.now();
    setTimeout(function () { ready = true; }, 400);
    app.querySelectorAll('.opt').forEach(function (b) {
      b.onclick = function () {
        if (!ready || Date.now() - shownAt < 400) return;
        ready = false;
        var code = q[1][+b.dataset.i][1], add = parse(code);
        Wave.add(code);
        for (var k in add) pts[k] = (pts[k] || 0) + add[k];
        b.classList.add('is-picked');
        app.querySelector('.opts').classList.add('is-leaving');
        setTimeout(function () { idx++; idx < ASK ? ask() : result(); window.scrollTo(0, 0); }, 320);
      };
    });
  }
  // 選択肢ごとの点の偏り（T や S が入った選択肢が多いなど）を消すため、出した質問の「平均的な答え」を差し引く
  function baseline() {
    var b = AXES.map(function () { return 0; });
    qs.forEach(function (q) {
      q[1].forEach(function (o) { vecOf(parse(o[1])).forEach(function (x, i) { b[i] += x / q[1].length; }); });
    });
    return b;
  }
  function result() {
    app.innerHTML = '<div class="listen"><p>あなたの音を、聴いています…</p></div>';
    Wave.listen();
    setTimeout(showResult, /[?&]dev\b/.test(location.search) ? 200 : 2800);
  }
  function showResult() {
    var b = baseline(), v = vecOf(pts).map(function (x, i) { return x - b[i]; });
    var ranked = TYPES.map(function (t) { return { t: t, s: cos(v, typeVec(t)) }; }).sort(function (a, b) { return b.s - a.s; });
    var m = ranked[0].t, s1 = ranked[1].t, s2 = ranked[2].t, close = ranked[0].s - ranked[1].s < 0.03;
    Wave.settle(m.c);
    try { if (window.gtag) gtag('event', 'oto_shindan_result', { main: m.id, sub: s1.id, after: s2.id, close: close ? 'yes' : 'no', stage: 'test' }); } catch (e) {}
    var small = function (t, kind) { return '<div style="--c:' + t.c + '"><p class="res-kind">' + kind + '</p><p class="res-name">' + esc(t.name) + '</p><p class="res-core">「' + esc(t.core) + '」</p><p class="res-who">' + esc(t.who) + 'に近い音</p></div>'; };
    var list = function (a) { return '<ul>' + a.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>'; };
    // あとで足せる欄（相性の良い音・おすすめ楽曲・関連エピソード）。中身があるときだけ出す
    var extra = function (title, a) { return a && a.length ? '<h3>' + title + '</h3><ul>' + a.map(function (x) {
      return '<li>' + (x.url ? '<a href="' + esc(x.url) + '"' + (/^https?:/.test(x.url) ? ' target="_blank" rel="noopener"' : '') + '>' + esc(x.title) + '</a>' : esc(x.title || x)) + '</li>'; }).join('') + '</ul>' : ''; };
    // 結果の順：主音（音名・キャラ・核）→ 説明 → 強み → 癖 → 揺れやすい場面 → ヒント → 一言 → 副音・余韻 → 当たってた？ → 追加の欄
    app.innerHTML = '<p class="label">YOUR SOUND</p><h1 style="font-size:20px;">今のあなたの音</h1>' +
      '<div class="res-main reveal" style="--c:' + m.c + '">' + (m.img ? '<div class="res-img"><img src="' + m.img + '" alt="' + esc(m.who) + '"></div>' : '') + '<p class="res-kind">あなたの主音</p><p class="res-name">' + esc(m.name) + '</p>' +
        '<p class="res-who">' + esc(m.who) + 'に近い音</p><p class="res-core">「' + esc(m.core) + '」</p>' +
        // 主音と副音がほぼ同じとき（差 0.03 未満。でたらめに答えた場合で約 1 割）は、数字を出さずに文で添える
        (close ? '<p class="res-close">ただ、<span style="color:' + s1.c + '">' + esc(s1.name) + '</span>も、すぐそばで響いています。</p>' : '') + '</div>' +
      '<div class="reveal" style="animation-delay:1.2s"><div class="detail" style="--c:' + m.c + '">' +
        '<h3>' + esc(m.name) + 'という音</h3><p>' + esc(m.nature) + '</p>' +
        '<h3>強み</h3>' + list(m.light) +
        '<h3>ときどき出やすい癖</h3>' + list(m.habit) +
        '<h3>心が揺れやすい場面</h3><p>' + esc(m.sway) + '</p>' +
        '<h3>今のあなたへのヒント</h3><p>' + esc(m.hint) + '</p>' +
        '<p class="msg" style="--c:' + m.c + '">' + esc(m.msg) + '</p>' +
      '</div></div>' +
      '<div class="res-sub reveal" style="animation-delay:2s">' + small(s1, 'あなたの副音') + small(s2, 'あなたの余韻') + '</div>' +
      // 当たってた？（押した数はアナリティクスの oto_shindan_feedback で見る。ページには数を出さない）
      '<div class="reveal" style="animation-delay:2.4s"><div class="fit"><p>この音、当たってた？</p>' +
        '<button type="button" data-fit="yes">当たってる</button><button type="button" data-fit="no">ちょっと違う</button></div>' +
      '<div class="detail" style="--c:' + m.c + '">' + extra('相性の良い音', m.compat) + extra('おすすめの曲', m.songs) + extra('関連するエピソード', m.episodes) + '</div>' +
      '<p class="lead" style="font-size:12px;margin-top:28px;">今の気分や時期によって、音は変わります。<br>これは、Snow flakes の世界を楽しむための診断です。</p>' +
      '<button class="btn" type="button" id="again">もう一度診断する</button></div>' +
      (/[?&]dev\b/.test(location.search) ? '<div class="dev">' + esc(AXES.map(function (ax, i) { return ax.join('↔') + ' ' + v[i]; }).join('\n') + '\n' + ranked.map(function (r) { return r.t.who + ' ' + r.s.toFixed(3); }).join('\n')) + '</div>' : '');
    document.getElementById('again').onclick = start;
    app.querySelectorAll('.fit button').forEach(function (b) {
      b.onclick = function () {
        try { if (window.gtag) gtag('event', 'oto_shindan_feedback', { main: m.id, fit: b.dataset.fit, stage: 'test' }); } catch (e) {}
        b.parentNode.innerHTML = '<p>' + (b.dataset.fit === 'yes' ? 'ありがとう。その音、大事にしてください。' : 'ありがとう。音は、時期や気分でも変わります。') + '</p>';
      };
    });
  }
  intro();
})();
</script>
<!-- BGM：音診断BGM（元 D:❄Snow flakes特集用BGM音診断BGM.mp3。メタデータを消して 128kbps に変換） -->
<audio id="oto-bgm" src="bgm.mp3" preload="none" loop></audio>
<button class="bgm-btn" id="bgm-btn" type="button" aria-pressed="false" aria-label="BGM を流す・止める">♪ BGM <span class="bgm-state">OFF</span></button>
<script>
// BGM の ON / OFF（ショーケース特集と同じ動き）
(function () {
  var a = document.getElementById('oto-bgm'), btn = document.getElementById('bgm-btn'), st = btn.querySelector('.bgm-state');
  a.volume = 0.3;
  function set(on) { btn.setAttribute('aria-pressed', on ? 'true' : 'false'); btn.classList.toggle('is-on', on); st.textContent = on ? 'ON' : 'OFF'; }
  btn.addEventListener('click', function () {
    if (a.paused) a.play().then(function () { set(true); }).catch(function () { set(false); });
    else { a.pause(); set(false); }
  });
  window.addEventListener('pagehide', function () { a.pause(); set(false); });
})();
</script>
<script src="../../artists/artist.js"></script>
</body>
</html>
