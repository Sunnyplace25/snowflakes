<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DZDSHRWLQF"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-DZDSHRWLQF');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ハヤテっち — Opening</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300&family=Cormorant+Garamond:wght@300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #060d1a; overflow: hidden; }

    #op {
      position: fixed; inset: 0;
      background: #060d1a;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── スマホ4枚 ── */
    #phones {
      display: flex;
      gap: clamp(12px, 3vw, 28px);
      align-items: center;
      justify-content: center;
      padding: 0 20px;
    }

    .slot {
      display: flex; flex-direction: column;
      align-items: center; gap: 10px;
      opacity: 0;
      transform: translateY(20px);
    }
    .slot:nth-child(1) { animation: slideUp 0.6s ease 0.5s forwards; }
    .slot:nth-child(2) { animation: slideUp 0.6s ease 1.0s forwards; }
    .slot:nth-child(3) { animation: slideUp 0.6s ease 1.5s forwards; }
    .slot:nth-child(4) { animation: slideUp 0.6s ease 2.0s forwards; }

    @keyframes slideUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .frame {
      background: #080f1e;
      border: 1.5px solid rgba(253,230,138,0.25);
      border-radius: clamp(12px,2.5vw,18px);
      overflow: hidden;
      box-shadow: 0 6px 30px rgba(0,0,0,0.7);
      width: clamp(80px, 20vw, 150px);
    }
    .frame img { width: 100%; display: block; }

    .cap {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(8px, 1.8vw, 10px);
      letter-spacing: 0.35em;
      color: rgba(253,230,138,0.35);
    }

    /* ── タイトル ── */
    #title-wrap {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px;
      background: #060d1a;
      opacity: 0;
      animation: titleIn 1s ease 4.2s forwards;
    }

    @keyframes titleIn { to { opacity: 1; } }

    .t-eye {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(9px, 2.5vw, 11px);
      letter-spacing: 0.5em;
      color: rgba(253,230,138,0.35);
      opacity: 0;
      animation: fadeIn 0.8s ease 4.6s forwards;
    }
    .t-main {
      font-family: 'Noto Serif JP', serif;
      font-weight: 300;
      font-size: clamp(36px, 11vw, 56px);
      letter-spacing: 0.22em;
      color: #fde68a;
      opacity: 0;
      transform: scale(0.95);
      animation: logoIn 1s ease 4.9s forwards;
    }

    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes logoIn { to { opacity: 1; transform: scale(1); } }

    /* ── 暗転アウト ── */
    #curtain {
      position: fixed; inset: 0;
      background: #000;
      opacity: 0; pointer-events: none;
      z-index: 50;
      animation: curtainOut 0.8s ease 7.5s forwards;
    }
    @keyframes curtainOut { to { opacity: 1; } }

    /* ── スキップ ── */
    #skip {
      position: fixed; bottom: 28px; right: 24px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px; letter-spacing: 0.3em;
      color: rgba(255,255,255,0.2);
      background: none; border: none; cursor: pointer;
      z-index: 60;
      -webkit-tap-highlight-color: transparent;
      animation: fadeIn 0.6s ease 1s forwards;
      opacity: 0;
    }
  </style>
</head>
<body>

<div id="op">

  <!-- スマホ4枚 -->
  <div id="phones">
    <div class="slot">
      <div class="frame"><img src="../hayatecchi_status.webp" alt="Status"></div>
      <span class="cap">Status</span>
    </div>
    <div class="slot">
      <div class="frame"><img src="../hayatecchi_drum.jpg" alt="Drum"></div>
      <span class="cap">Drum</span>
    </div>
    <div class="slot">
      <div class="frame"><img src="../hayatecchi_bar.webp" alt="Bar"></div>
      <span class="cap">Bar Stars</span>
    </div>
    <div class="slot">
      <div class="frame"><img src="../hayatecchi_collection.webp" alt="Collection"></div>
      <span class="cap">Collection</span>
    </div>
  </div>

  <!-- タイトル -->
  <div id="title-wrap">
    <p class="t-eye">Snow flakes presents</p>
    <p class="t-main">ハヤテっち</p>
  </div>

</div>

<!-- 暗転 -->
<div id="curtain"></div>

<!-- スキップ -->
<button id="skip" onclick="skipOpening()">tap to skip</button>

<audio id="bgm" src="bgm.mp3" preload="auto"></audio>

<script>
  // BGM
  var bgm = document.getElementById('bgm');
  bgm.volume = 0.15;
  bgm.play().catch(function(){});

  // 終了タイマー
  var endTimer = setTimeout(function() {
    onEnd();
  }, 8300);

  function skipOpening() {
    clearTimeout(endTimer);
    onEnd();
  }

  function onEnd() {
    document.getElementById('curtain').style.animation = 'none';
    document.getElementById('curtain').style.opacity = '1';
    bgm.pause();
    setTimeout(function() {
      document.getElementById('op').style.display = 'none';
      document.getElementById('curtain').style.opacity = '0';
      if (typeof window.HayatecchiOpeningEnd === 'function') {
        window.HayatecchiOpeningEnd();
      }
    }, 800);
  }

  window.HayatecchiOpening = { play: function(cb) {
    window.HayatecchiOpeningEnd = cb;
    bgm.currentTime = 0;
    bgm.volume = 0.15;
    bgm.play().catch(function(){});
  }};
</script>

</body>
</html>
