<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ハヤテっち</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DZDSHRWLQF"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-DZDSHRWLQF');</script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080f1e;
      color: #e2e8f0;
      font-family: 'Noto Serif JP', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      bottom: -60px; left: 50%;
      transform: translateX(-50%);
      width: 480px; height: 300px;
      background: radial-gradient(ellipse, rgba(253,230,138,0.10) 0%, transparent 70%);
      pointer-events: none;
    }
    #snow-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      width: 100%;
      max-width: 400px;
      padding: 32px 20px 100px;
    }

    .app-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      letter-spacing: 8px;
      color: #fde68a;
      text-align: center;
      margin-bottom: 4px;
    }
    .app-sub {
      font-family: 'Cormorant Garamond', serif;
      font-size: 9px;
      letter-spacing: 4px;
      color: #334155;
      text-align: center;
    }

    /* キャラエリア */
    .chara-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }
    .chara-img-wrap {
      width: 100%;
      height: 260px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      position: relative;
    }
    .chara-img {
      max-height: 255px;
      object-fit: contain;
      transition: opacity 0.3s;
    }
    .chara-img.single { max-width: 210px; }
    .chara-img.bounce { animation: chara-bounce 0.4s ease; }
    @keyframes chara-bounce {
      0%   { transform: translateY(0); }
      40%  { transform: translateY(-12px); }
      100% { transform: translateY(0); }
    }
    .chara-glow { animation: glow-h 3s ease-in-out infinite; }
    @keyframes glow-h {
      0%,100% { filter: drop-shadow(0 0 8px rgba(253,230,138,0.25)); }
      50%      { filter: drop-shadow(0 0 22px rgba(253,230,138,0.55)); }
    }

    /* 3人並び */
    .live-band {
      display: none;
      width: 100%;
      height: 200px;
      align-items: flex-end;
      justify-content: center;
      gap: 4px;
    }
    .live-band img {
      max-height: 190px;
      max-width: 110px;
      object-fit: contain;
    }
    .live-band img.center { max-height: 200px; max-width: 130px; }

    /* 吹き出し */
    .speech-bubble {
      background: rgba(253,230,138,0.04);
      border: 1px solid rgba(253,230,138,0.18);
      border-radius: 16px;
      padding: 14px 20px;
      margin-top: 14px;
      width: 100%;
      min-height: 54px;
      position: relative;
      display: flex;
      align-items: center;
    }
    .speech-bubble::before {
      content: '';
      position: absolute;
      top: -8px; left: 50%;
      transform: translateX(-50%);
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-bottom: 8px solid rgba(253,230,138,0.18);
    }
    .speech-text {
      font-size: 13px;
      line-height: 1.75;
      color: #cbd5e1;
      letter-spacing: 0.5px;
      transition: opacity 0.1s;
    }

    .section-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 9px;
      letter-spacing: 5px;
      color: #334155;
      margin-bottom: 14px;
    }
    .divider {
      width: 100%;
      height: 1px;
      background: rgba(255,255,255,0.04);
      margin: 22px 0;
    }

    /* ステータス */
    .status-section { margin-bottom: 24px; }
    .status-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .skill-badge {
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px;
      letter-spacing: 2px;
      color: #fde68a;
      border: 1px solid rgba(253,230,138,0.28);
      border-radius: 100px;
      padding: 3px 12px;
    }
    .stat-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 11px;
    }
    .stat-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px;
      letter-spacing: 2px;
      color: #64748b;
      width: 60px;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .stat-bar-bg {
      flex: 1;
      height: 3px;
      background: rgba(255,255,255,0.05);
      border-radius: 100px;
      overflow: hidden;
    }
    .stat-bar-fill {
      height: 100%;
      border-radius: 100px;
      background: #fde68a;
      transition: width 0.6s ease, background 0.4s;
    }
    .stat-bar-fill.mid { background: #fcd34d; }
    .stat-bar-fill.low { background: #fca5a5; }
    .stat-bar-fill.renshu-ge { background: #6ee7b7; }
    .stat-val {
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px;
      color: #334155;
      width: 26px;
      text-align: right;
      flex-shrink: 0;
    }

    /* アクション */
    .action-section { margin-bottom: 20px; }
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    .action-btn {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px 8px 10px;
      color: #94a3b8;
      font-family: 'Noto Serif JP', serif;
      font-size: 11px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      -webkit-tap-highlight-color: transparent;
    }
    .action-btn:hover {
      background: rgba(253,230,138,0.06);
      border-color: rgba(253,230,138,0.25);
      color: #fde68a;
    }
    .action-btn:active { transform: scale(0.96); }
    .action-icon { font-size: 19px; line-height: 1; }
    .action-cd {
      font-family: 'Cormorant Garamond', serif;
      font-size: 9px;
      letter-spacing: 1px;
      color: #334155;
      min-height: 14px;
    }
    .action-btn.on-cd { opacity: 0.4; cursor: default; }
    .action-btn.on-cd:hover {
      background: rgba(255,255,255,0.02);
      border-color: rgba(255,255,255,0.08);
      color: #94a3b8;
    }
    /* ライブボタン */
    .live-btn {
      width: 100%;
      margin-top: 10px;
      background: rgba(196,181,253,0.06);
      border: 1px solid rgba(196,181,253,0.25);
      border-radius: 12px;
      padding: 14px 10px 11px;
      color: #c4b5fd;
      font-family: 'Noto Serif JP', serif;
      font-size: 12px;
      letter-spacing: 3px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      -webkit-tap-highlight-color: transparent;
      animation: live-pulse 2.5s ease-in-out infinite;
    }
    @keyframes live-pulse {
      0%,100% { box-shadow: 0 0 0 rgba(196,181,253,0); }
      50%      { box-shadow: 0 0 18px rgba(196,181,253,0.25); }
    }
    .live-btn:hover {
      background: rgba(196,181,253,0.12);
      border-color: rgba(196,181,253,0.5);
    }
    .live-btn:active { transform: scale(0.97); }
    .live-btn.on-cd { opacity: 0.4; cursor: default; animation: none; }
    .live-btn.on-cd:hover {
      background: rgba(196,181,253,0.06);
      border-color: rgba(196,181,253,0.25);
    }
    .live-btn.locked {
      opacity: 0.25;
      cursor: default;
      animation: none;
      border-color: rgba(255,255,255,0.08);
      color: #475569;
    }
    .live-btn.locked:hover {
      background: rgba(196,181,253,0.06);
      border-color: rgba(255,255,255,0.08);
      color: #475569;
    }

    /* トースト */
    .toast {
      position: fixed;
      bottom: 36px; left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: rgba(8,15,30,0.96);
      border: 1px solid rgba(253,230,138,0.28);
      border-radius: 100px;
      padding: 10px 26px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 12px;
      letter-spacing: 3px;
      color: #fde68a;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ライブ演出オーバーレイ */
    .live-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4,8,20,0.96);
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s;
    }
    .live-overlay.show { opacity: 1; pointer-events: auto; }
    .live-overlay-band {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 8px;
      margin-bottom: 32px;
    }
    .live-overlay-band img {
      height: 170px;
      width: auto;
      max-width: 130px;
      object-fit: contain;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.5s, transform 0.5s;
    }
    .live-overlay-band img.center { height: 170px; max-width: 160px; }
    .live-overlay-band img.in { opacity: 1; transform: translateY(0); }
    .live-overlay-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      letter-spacing: 8px;
      color: #c4b5fd;
      margin-bottom: 16px;
      opacity: 0;
      transition: opacity 0.5s 0.6s;
    }
    .live-overlay-title.in { opacity: 1; }
    .live-overlay-result {
      font-family: 'Noto Serif JP', serif;
      font-size: 14px;
      color: #e2e8f0;
      text-align: center;
      line-height: 2;
      opacity: 0;
      transition: opacity 0.5s 1s;
      margin-bottom: 32px;
    }
    .live-overlay-result.in { opacity: 1; }
    .live-overlay-close {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      letter-spacing: 4px;
      color: #475569;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 100px;
      padding: 10px 28px;
      background: none;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.4s 1.5s, color 0.2s, border-color 0.2s;
    }
    .live-overlay-close.in { opacity: 1; }
    .live-overlay-close:hover { color: #c4b5fd; border-color: rgba(196,181,253,0.4); }

    /* SWEETsゲット */
    .sweets-get-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      display: flex; align-items: center; justify-content: center;
      z-index: 300; opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
    }
    .sweets-get-overlay.show { opacity: 1; pointer-events: auto; }
    .sweets-get-box {
      text-align: center; padding: 44px 40px;
      background: rgba(20,10,50,0.97); border-radius: 20px;
      border: 1px solid rgba(253,230,138,0.35);
      animation: none;
    }
    .sweets-get-img { width: 100px; height: 100px; object-fit: contain; margin-bottom: 16px; image-rendering: pixelated; }
    .sweets-get-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px; color: #fde68a;
      letter-spacing: 4px; margin-bottom: 6px;
    }
    .sweets-get-sub { font-size: 11px; color: #94a3b8; letter-spacing: 1px; }

    /* タップ参加 */
    .live-tap-hint {
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px;
      letter-spacing: 4px;
      color: #6d5fc4;
      margin-bottom: 16px;
      animation: tap-blink 1.2s ease-in-out infinite;
    }
    @keyframes tap-blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
    .live-tap-count {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      letter-spacing: 2px;
      color: #c4b5fd;
      margin-bottom: 8px;
      min-height: 40px;
    }
    .spark {
      position: fixed;
      pointer-events: none;
      font-size: 18px;
      color: #c4b5fd;
      z-index: 300;
      animation: spark-fly 0.9s ease-out forwards;
    }
    @keyframes spark-fly {
      0%   { opacity: 1; transform: translate(0,0) scale(1); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.4); }
    }
    .live-success {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      letter-spacing: 3px;
      color: #fde68a;
      opacity: 0;
      transition: opacity 0.4s;
      text-shadow: 0 0 30px rgba(253,230,138,0.8);
      margin-bottom: 12px;
    }
    .live-success.in { opacity: 1; }
    @media (max-height: 780px), (max-width: 375px) {
      .chara-img-wrap { height: 200px; }
      .chara-img { max-height: 195px; }
      .chara-area { margin-bottom: 14px; }
      .speech-bubble { padding: 10px 16px; min-height: 42px; margin-top: 10px; }
      .speech-text { font-size: 12px; }
      .divider { margin: 14px 0; }
      .status-section { margin-bottom: 14px; }
      .stat-row { margin-bottom: 7px; }
      .section-label { margin-bottom: 8px; }
      .action-btn { padding: 9px 7px 7px; gap: 4px; }
      .action-icon { font-size: 17px; }
      .action-grid { gap: 7px; }
      .live-btn { padding: 10px 10px 8px; gap: 4px; margin-top: 7px; }
    }
  </style>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ハヤテっち">
</head>
<body>

  <!-- スプラッシュ画面 -->
  <div id="splash" style="position:fixed;inset:0;z-index:9999;background:#0a0a1a;display:flex;align-items:center;justify-content:center;transition:opacity 0.5s;cursor:pointer;">
    <img src="splash.webp" alt="ハヤテっち" style="width:100%;height:100%;object-fit:cover;object-position:center top;">
  </div>
  <script>
    (function() {
      var splash = document.getElementById('splash');
      function dismiss() {
        splash.style.opacity = '0';
        setTimeout(function() { splash.style.display = 'none'; }, 500);
        splash.removeEventListener('click', dismiss);
        splash.removeEventListener('touchstart', dismiss);
      }
      splash.addEventListener('click', dismiss);
      splash.addEventListener('touchstart', dismiss);
    })();
  </script>

  <canvas id="snow-canvas"></canvas>
  <audio id="live-bgm" src="live1.mp3" preload="auto"></audio>
  <audio id="live-bgm2" src="live2.mp3" preload="auto"></audio></audio>
  <div class="wrapper">

    <!-- キャラ -->
    <div class="chara-area">
      <div class="chara-img-wrap">
        <img id="chara-img" class="chara-img single chara-glow" src="hayate_normal.webp" alt="ハヤテ">
      </div>
      <div class="speech-bubble">
        <span class="speech-text" id="speech-text">どした？</span>
      </div>
    </div>

    <!-- ステータス -->
    <div class="status-section">
      <div class="status-header">
        <div class="section-label">status</div>
        <div style="display:flex;gap:8px;">
          <div class="skill-badge" id="live-count-badge" style="border-color:rgba(196,181,253,0.28);color:#c4b5fd;">LIVE × 0</div>
          <div class="skill-badge" id="skill-badge">Drum Lv.1</div>
        </div>
      </div>
      <div class="stat-row">
        <div class="stat-name">おなか</div>
        <div class="stat-bar-bg"><div class="stat-bar-fill" id="bar-onaka" style="width:80%"></div></div>
        <div class="stat-val" id="val-onaka">80</div>
      </div>
      <div class="stat-row">
        <div class="stat-name">すいみん</div>
        <div class="stat-bar-bg"><div class="stat-bar-fill" id="bar-suimin" style="width:80%"></div></div>
        <div class="stat-val" id="val-suimin">80</div>
      </div>
      <div class="stat-row">
        <div class="stat-name">やるき</div>
        <div class="stat-bar-bg"><div class="stat-bar-fill" id="bar-yaruki" style="width:70%"></div></div>
        <div class="stat-val" id="val-yaruki">70</div>
      </div>
      <div class="stat-row">
        <div class="stat-name">きぶん</div>
        <div class="stat-bar-bg"><div class="stat-bar-fill" id="bar-kibun" style="width:77%"></div></div>
        <div class="stat-val" id="val-kibun">77</div>
      </div>
      <div class="stat-row">
        <div class="stat-name">れんしゅう</div>
        <div class="stat-bar-bg"><div class="stat-bar-fill renshu-ge" id="bar-renshu-ge" style="width:0%"></div></div>
        <div class="stat-val" id="val-renshu-ge">0</div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- アクション -->
    <div class="action-section">
      <div class="section-label">action</div>
      <div class="action-grid">
        <button class="action-btn" id="btn-meshi" onclick="doAction('meshi')">
          <span class="action-icon">🍙</span>
          <span>ごはん</span>
          <span class="action-cd" id="cd-meshi"></span>
        </button>
        <button class="action-btn" id="btn-neru" onclick="doAction('neru')">
          <span class="action-icon">💤</span>
          <span>寝かせる</span>
          <span class="action-cd" id="cd-neru"></span>
        </button>
        <button class="action-btn" id="btn-renshu" onclick="doAction('renshu')">
          <span class="action-icon">🥁</span>
          <span>ドラム練習</span>
          <span class="action-cd" id="cd-renshu"></span>
        </button>
        <button class="action-btn" id="btn-hanasu" onclick="doAction('hanasu')">
          <span class="action-icon">💬</span>
          <span>話しかける</span>
          <span class="action-cd" id="cd-hanasu"></span>
        </button>
        <button class="action-btn" id="btn-flyer" onclick="doAction('flyer')">
          <span class="action-icon">📄</span>
          <span>フライヤーを配る</span>
          <span class="action-cd" id="cd-flyer"></span>
        </button>
        <button class="action-btn" id="btn-sweets" onclick="doAction('sweets')">
          <span class="action-icon"><img src="sweets.webp" style="width:22px;height:22px;object-fit:contain;image-rendering:pixelated;vertical-align:middle;"></span>
          <span>SWEETs</span>
          <span class="action-cd" id="sweets-count">×0</span>
        </button>
      </div>

      <!-- ライブボタン -->
      <button class="live-btn locked" id="btn-live" onclick="doLive()">
        <span style="font-size:20px;">🎸</span>
        <span>LIVE</span>
        <span style="font-family:'Cormorant Garamond',serif;font-size:9px;letter-spacing:2px;color:#8b5cf6;">音楽が流れます</span>
        <span class="action-cd" id="cd-live" style="color:#475569;"></span>
      </button>
    </div>
  </div>

  <!-- ホームに追加 -->
  <div id="a2hs-bar" style="display:none;max-width:360px;margin:0 auto 12px;padding:0 20px;">
    <button id="a2hs-btn" style="width:100%;padding:11px;border-radius:10px;background:rgba(253,230,138,0.08);border:1px solid rgba(253,230,138,0.25);color:#fde68a;font-size:12px;letter-spacing:2px;cursor:pointer;font-family:'Cormorant Garamond',serif;">
      ＋ ホーム画面に追加
    </button>
  </div>
  <!-- iOS用ガイド -->
  <div id="ios-a2hs" style="display:none;max-width:360px;margin:0 auto 12px;padding:0 20px;">
    <div style="border:1px solid rgba(253,230,138,0.2);border-radius:10px;padding:14px 16px;background:rgba(253,230,138,0.04);font-size:11px;color:#64748b;line-height:2;text-align:center;">
      Safari の <span style="color:#fde68a;">共有ボタン</span> →<br>「ホーム画面に追加」でいつでも起動できます
    </div>
  </div>

  <!-- DATA BACKUP -->
  <div style="max-width:360px;margin:0 auto 24px;padding:0 20px;">
    <div style="border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:20px;background:rgba(255,255,255,0.02);">
      <div style="font-family:'Cormorant Garamond',serif;font-size:10px;letter-spacing:5px;color:#475569;text-align:center;margin-bottom:14px;">DATA BACKUP</div>
      <p style="font-size:11px;color:#64748b;line-height:1.8;margin-bottom:14px;text-align:center;">IDとPINを設定するとデータを保存できます。<br>必ずメモしておいてください。</p>
      <input id="backup-id" type="text" placeholder="バックアップID" maxlength="20"

  <script>
    /* ── 定数 ── */
    var SAVE_KEY = 'hayatecchi_v1';
    var LIVE_UNLOCK_RENSHU = 100;

    var DECAY = {
      onaka:  14 / 3600,   // 約7時間で空
      suimin: 11 / 3600,   // 約9時間で空
      yaruki:  8 / 3600    // 約12時間で空
    };
    var CD_SEC = {
      meshi:  15 * 60,
      neru:   30 * 60,
      renshu: 30 * 60,
      flyer:  20 * 60,
      live:   3600
    };

    /* ── 状態 ── */
    var st = {
      onaka: 80, suimin: 80, yaruki: 70, kibun: 75,
      renshuGe: 0, skill: 0, liveCount: 0, sweets: 0,
      lastSaved: new Date().toISOString(),
      cd: {}
    };

    /* ── セーブ / ロード ── */
    function save() {
      st.lastSaved = new Date().toISOString();
      localStorage.setItem(SAVE_KEY, JSON.stringify(st));
    }
    function load() {
      try {
        var d = JSON.parse(localStorage.getItem(SAVE_KEY));
        if (!d) return;
        st = d;
        if (!st.cd) st.cd = {};
        if (st.renshuGe === undefined) st.renshuGe = 0;
        if (st.sweets   === undefined) st.sweets   = 0;
        if (st.kibun     === undefined) st.kibun     = 75;
        if (st.liveCount === undefined) st.liveCount = 0;
        var elapsed = Math.max(0, (Date.now() - new Date(st.lastSaved).getTime()) / 1000);
        st.onaka  = clamp(st.onaka  - DECAY.onaka  * elapsed);
        st.suimin = clamp(st.suimin - DECAY.suimin * elapsed);
        st.yaruki = clamp(st.yaruki - DECAY.yaruki * elapsed);
      } catch(e) {}
    }
    function clamp(v, lo, hi) {
      return Math.min(hi||100, Math.max(lo||0, v));
    }

    /* ── 計算 ── */
    function calcKibun() {
      return Math.round(st.kibun || 75);
    }
    function fluctuateKibun() {
      // ランダムで±8変動、他のステータスが低いと下がりやすい
      var rand = (Math.random() * 16) - 8;
      var penalty = (st.onaka < 30 || st.suimin < 30) ? -5 : 0;
      st.kibun = clamp((st.kibun || 75) + rand + penalty);
    }
    function getLevel() { return Math.floor((st.skill||0) / 10) + 1; }
    function getCharaState() {
      var k = calcKibun();
      if (st.onaka  < 20) return 'hungry';
      if (st.suimin < 20) return 'sleepy';
      if (k < 25)         return 'mood_bad';
      if (k > 82)         return 'happy';
      return 'normal';
    }

    var _lastLine = '';
    function randLine(arr) {
      var line = arr[Math.floor(Math.random() * arr.length)];
      if (arr.length > 1 && line === _lastLine) line = arr[Math.floor(Math.random() * arr.length)];
      _lastLine = line;
      return line;
    }

    /* ── CD ── */
    function cdRemain(action) {
      var t = st.cd[action];
      if (!t) return 0;
      return Math.max(0, Math.ceil((new Date(t).getTime() - Date.now()) / 1000));
    }
    function fmtCD(sec) {
      if (sec <= 0) return '';
      if (sec < 60) return sec + '秒';
      var m = Math.ceil(sec / 60);
      if (m < 60) return m + '分';
      return Math.floor(m / 60) + '時間' + (m % 60 ? (m % 60) + '分' : '');
    }

    /* ── 画像 ── */
    var CHARA_IMGS = {
      normal:   'hayate_normal.webp',
      happy:    'hayate_happy.webp',
      hungry:   'hayate_hungry.webp',
      sleepy:   'hayate_sleepy.webp',
      mood_bad: 'hayate_mood_bad.webp',
      practice: 'hayate_practice.webp',
      flyer:    'hayate_flyer.webp'
    };

    /* ── アクション ── */
    var _speechLock = false;
    var _speechTimer = null;
    var _imgTimer = null;

    function doAction(action) {
      var remain = cdRemain(action);
      if (remain > 0 && action !== 'hanasu') {
        flash('あと ' + fmtCD(remain) + ' 待って');
        return;
      }

      var speech = '', toast = '', imgOverride = null;

      if (action === 'meshi') {
        if (st.onaka >= 95) {
          speech = 'もう腹いっぱいだって……';
        } else {
          st.onaka = clamp(st.onaka + 30);
          st.cd.meshi = cdTime(CD_SEC.meshi);
          speech = 'うまい！！';
          toast  = 'おなか +30';
        }
      }
      else if (action === 'neru') {
        if (st.suimin >= 95) {
          speech = '全然眠くないんだけど';
        } else {
          st.suimin = clamp(st.suimin + 40);
          st.cd.neru = cdTime(CD_SEC.neru);
          // LIVEクールダウンを20分短縮
          if (st.cd.live) {
            var liveCdMs = new Date(st.cd.live).getTime() - 20 * 60 * 1000;
            st.cd.live = liveCdMs > Date.now() ? new Date(liveCdMs).toISOString() : null;
          }
          speech = 'zzz…　すっきりした！';
          toast  = 'すいみん +40';
          imgOverride = 'sleepy';
        }
      }
      else if (action === 'renshu') {
        st.yaruki   = clamp(st.yaruki + 20);
        st.skill    = (st.skill || 0) + 5;
        st.onaka    = clamp(st.onaka - 15);
        st.renshuGe = clamp(st.renshuGe + 25, 0, 100);
        st.cd.renshu = cdTime(CD_SEC.renshu);
        speech = 'よっしゃ練習するか！！';
        toast  = 'ドラムスキル +5　練習ゲージ +25　おなか -15';
        imgOverride = 'practice';
      }
      else if (action === 'hanasu') {
        var now = Date.now();
        _talkLog = _talkLog.filter(function(t) { return now - t < TALK_TIRED_WINDOW; });
        _talkLog.push(now);
        if (_talkLog.length >= TALK_TIRED_COUNT) {
          speech = randLine(TIRED_LINES);
          st.yaruki = clamp(st.yaruki - 5);
          st.kibun  = clamp(st.kibun  - 8);
          st.suimin = clamp(st.suimin - 8);
        } else {
          speech = randLine(TALK_LINES);
          st.yaruki = clamp(st.yaruki + 2);
        }
      }
      else if (action === 'flyer') {
        st.yaruki = clamp(st.yaruki + 8);
        st.kibun  = clamp(st.kibun  + 5);
        st.onaka  = clamp(st.onaka  - 10);
        st.cd.flyer = cdTime(CD_SEC.flyer);
        speech = randLine(FLYER_LINES);
        toast  = 'やる気 +8　きぶん +5　おなか -10';
        imgOverride = 'flyer';
      }
      else if (action === 'sweets') {
        if ((st.sweets || 0) <= 0) { flash('SWEETsないな……またもらってこよう'); return; }
        st.sweets = (st.sweets || 0) - 1;
        st.kibun  = 100;
        speech = randLine(SWEETS_LINES);
        toast  = 'きぶん 満タン！';
      }

      if (speech) setSpeech(speech, imgOverride);
      if (toast)  flash(toast);
      bounce();
      save();
      render(true);
    }

    function cdTime(sec) {
      return new Date(Date.now() + sec * 1000).toISOString();
    }

    /* ── ライブ ── */
    function doLive() {
      if ((st.renshuGe || 0) < LIVE_UNLOCK_RENSHU) {
        flash('もうちょっとだけ練習してからにしよう');
        return;
      }
      if (cdRemain('live') > 0) {
        flash('ちょっとだけ休ませて　あと ' + fmtCD(cdRemain('live')));
        return;
      }

      // ライブ結果
      var kibun = calcKibun();
      var success = kibun > 40 && st.skill >= 5;
      var skillGain = success ? 8 : 3;

      st.skill     = (st.skill || 0) + skillGain;
      st.yaruki    = clamp(st.yaruki + (success ? 30 : 10));
      st.liveCount = (st.liveCount || 0) + 1;
      st.renshuGe  = 0;
      st.cd.live   = cdTime(CD_SEC.live);

      var resultText = success
        ? 'ライブ成功！！\nドラムスキル +' + skillGain
        : 'ライブ終了\n次はもっとうまくやる';

      showLiveOverlay(success, resultText);
      save();
    }

    function pauseAllAudio() {
      document.querySelectorAll('audio').forEach(function(el) {
        el.pause();
      });
    }
    function startLiveBGM() {
      pauseAllAudio();
      var src = Math.random() < 0.5 ? 'live-bgm' : 'live-bgm2';
      var el = document.getElementById(src);
      if (!el) return;
      el.volume = _muted ? 0 : 0.55;
      el.currentTime = 0;
      el.onended = function() { _tapPhase = 'tapping'; showLiveResult(); };
      el.play().catch(function(){});
    }
    function stopLiveBGM() {
      pauseAllAudio();
    }

    var _tapPhase = 'waiting';
    var _tapTimer = null;
    var _pendingResult = null;

      var closeBtn = document.getElementById('live-close');
      var tapCount = document.getElementById('live-tap-count');
      var tapHint  = document.getElementById('live-tap-hint');
      var successEl= document.getElementById('live-success');

      _tapCount = 0;
      _tapPhase = 'waiting';
      _pendingResult = { success: success, text: resultText };

      overlay.querySelectorAll('img').forEach(function(i) { i.classList.remove('in'); });
      [title, result, closeBtn, successEl].forEach(function(el) { el.classList.remove('in'); });
      if (tapCount) { tapCount.textContent = ''; tapCount.style.display = ''; }
      if (tapHint)  tapHint.style.display = '';
      overlay.classList.add('show');
      startLiveBGM();

      setTimeout(function() { document.getElementById('live-hinata').classList.add('in'); }, 100);
      setTimeout(function() { document.getElementById('live-hayate').classList.add('in'); }, 300);
      setTimeout(function() { document.getElementById('live-kouta').classList.add('in'); }, 500);
      setTimeout(function() { title.classList.add('in'); }, 700);
      setTimeout(function() {
        _tapPhase = 'tapping';
      }, 900);

      overlay.onclick = function(e) {
        if (_tapPhase !== 'tapping') return;
        _tapCount++;
        if (tapCount) tapCount.textContent = _tapCount;
        spawnSpark(e.clientX, e.clientY);
      };
    }

    function spawnSpark(x, y) {
      var hot = _tapCount >= 100;
      var symbols = hot
        ? ['✦','✧','❄','★','🎵','💥','⚡','🌟']
        : ['✦','✧','❄','★','·'];
      var count = hot ? 10 : 4;
      var maxDist = hot ? 120 : 60;
      var colors = hot
        ? ['#fde68a','#c4b5fd','#93c5fd','#fca5a5','#ffffff']
        : ['#c4b5fd'];

      for (var i = 0; i < count; i++) {
        var el = document.createElement('div');
        el.className = 'spark';
        el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        var angle = Math.random() * Math.PI * 2;
        var dist  = (hot ? 60 : 40) + Math.random() * maxDist;
        el.style.left = x + 'px';
        el.style.top  = y + 'px';
        el.style.color = colors[Math.floor(Math.random() * colors.length)];
        if (hot) el.style.fontSize = (16 + Math.random() * 16) + 'px';
        el.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
        el.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
        document.body.appendChild(el);
        setTimeout(function(e) { e.remove(); }, 900, el);
      }
    }

    function showLiveResult() {
      if (_tapPhase !== 'tapping') return;
      _tapPhase = 'result';
      clearTimeout(_tapTimer);

      var overlay  = document.getElementById('live-overlay');
      overlay.onclick = null;

      var result   = document.getElementById('live-result');
      var closeBtn = document.getElementById('live-close');
      var tapCount = document.getElementById('live-tap-count');
      var tapHint  = document.getElementById('live-tap-hint');
      var successEl= document.getElementById('live-success');

      if (tapCount) tapCount.style.display = 'none';
      if (tapHint)  tapHint.style.display  = 'none';

      var bonus = _tapCount >= 180 ? 20 : _tapCount >= 100 ? 12 : _tapCount >= 50 ? 5 : 0;
      if (bonus > 0) {
        st.skill  = (st.skill || 0) + bonus;
        st.yaruki = clamp(st.yaruki + bonus * 0.5);
        save();
      }

      var p = _pendingResult;
      var gotSweets = p.success && _tapCount >= 200;
      if (gotSweets) {
        st.sweets = (st.sweets || 0) + 1;
        save();
      }
      _pendingSweetsGet = gotSweets;

      successEl.textContent = randLine(LIVE_SUCCESS_LINES);
      successEl.classList.add('in');
      setTimeout(function() {
        closeBtn.classList.add('in');
      }, 800);
    }

    var _pendingSweetsGet = false;
    var _autoSleepTriggered = false;

    function showSweetsGet() {
      var el = document.getElementById('sweets-get-overlay');
      if (el) el.classList.add('show');
    }
    function closeSweetsGet() {
      var el = document.getElementById('sweets-get-overlay');
      if (el) el.classList.remove('show');
    }

    function closeLive() {
      var overlay = document.getElementById('live-overlay');
      overlay.classList.remove('show');
      stopLiveBGM();
      setSpeech(randLine(LIVE_LINES), null);
      bounce();
      render();
      if (_pendingSweetsGet) {
        _pendingSweetsGet = false;
        setTimeout(showSweetsGet, 300);
      }
    }

    /* ── 表示 ── */
    function setSpeech(text, imgOverride) {
      var el = document.getElementById('speech-text');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function() { el.textContent = text; el.style.opacity = '1'; }, 120);
      _speechLock = true;
      clearTimeout(_speechTimer);
      if (imgOverride) {
        setImg(imgOverride);
        clearTimeout(_imgTimer);
        _imgTimer = setTimeout(function() { _imgTimer = null; setImg(getCharaState()); }, 3000);
      }
      _speechTimer = setTimeout(function() { _speechLock = false; autoSpeech(); }, 4000);
    }

    function autoSpeech() {
      if (_speechLock) return;
      var el = document.getElementById('speech-text');
      if (!el) return;
      var line = randLine(SPEECHES[getCharaState()] || SPEECHES.normal);
      el.style.opacity = '0';
      setTimeout(function() { el.textContent = line; el.style.opacity = '1'; }, 150);
    }

    function setImg(state) {
      var img = document.getElementById('chara-img');
      if (!img) return;
      var src = CHARA_IMGS[state] || CHARA_IMGS.normal;
      if (img.getAttribute('src') !== src) img.src = src;
    }

    function bounce() {
      var img = document.getElementById('chara-img');
      if (!img) return;
      img.classList.remove('bounce');
      void img.offsetWidth;
      img.classList.add('bounce');
    }

    function render() {
      var kibun = calcKibun();
      if (!_imgTimer) setImg(getCharaState());
      setBar('onaka',  Math.round(st.onaka));
      setBar('suimin', Math.round(st.suimin));
      setBar('yaruki', Math.round(st.yaruki));
      setBar('kibun',  kibun);
      setBar('renshu-ge', Math.round(st.renshuGe || 0));

      var badge = document.getElementById('skill-badge');
      if (badge) badge.textContent = 'Drum Lv.' + getLevel();
      var liveBadge = document.getElementById('live-count-badge');
      if (liveBadge) liveBadge.textContent = 'LIVE × ' + (st.liveCount || 0);

      // ライブボタン状態
      var liveBtn = document.getElementById('btn-live');
      var liveCd  = document.getElementById('cd-live');
      if (liveBtn) {
        var locked = (st.renshuGe || 0) < LIVE_UNLOCK_RENSHU;
        var onCd   = cdRemain('live') > 0;
        liveBtn.className = 'live-btn' + (locked || onCd ? ' locked' : '');
        if (liveCd) liveCd.textContent = locked
          ? '練習ゲージ満タンで解放'
          : onCd ? fmtCD(cdRemain('live')) + ' 休憩中' : '';
      }

      var sweetsBtn   = document.getElementById('btn-sweets');
      var sweetsCount = document.getElementById('sweets-count');
      var sc = st.sweets || 0;
      if (sweetsBtn)   sweetsBtn.classList.toggle('on-cd', sc === 0);
      if (sweetsCount) sweetsCount.textContent = '×' + sc;

      updateCD();

      // すいみん20以下で強制おやすみ
      if ((st.suimin || 0) <= 20 && !_autoSleepTriggered) {
        _autoSleepTriggered = true;
        setSpeech('もう限界だ……ねむい', null);
        setTimeout(function() {
          st.suimin = clamp(st.suimin + 40);
          st.cd.neru = cdTime(CD_SEC.neru);
          if (st.cd.live) {
            var liveCdMs = new Date(st.cd.live).getTime() - 20 * 60 * 1000;
            st.cd.live = liveCdMs > Date.now() ? new Date(liveCdMs).toISOString() : null;
          }
          setImg('sleepy', 3000);
          setSpeech('zzz…　すっきりした！', null);
          flash('強制おやすみ　すいみん +40');
          save();
          render();
        }, 2000);
      }
      if ((st.suimin || 0) > 20) _autoSleepTriggered = false;
    }

    function setBar(name, val) {
      var fill = document.getElementById('bar-' + name);
      var valEl = document.getElementById('val-' + name);
      if (fill) {
        fill.style.width = val + '%';
        var cls = 'stat-bar-fill';
        if (name === 'renshu-ge') cls += ' renshu-ge';
        else if (val < 25) cls += ' low';
        else if (val < 50) cls += ' mid';
        fill.className = cls;
      }
      if (valEl) valEl.textContent = val;
    }

    function updateCD() {
      ['meshi','neru','renshu','flyer'].forEach(function(a) {
        var btn  = document.getElementById('btn-' + a);
        var cdEl = document.getElementById('cd-' + a);
        var rem  = cdRemain(a);
        if (btn)  btn.classList.toggle('on-cd', rem > 0);
        if (cdEl) cdEl.textContent = rem > 0 ? fmtCD(rem) : '';
      });
    }

    /* ── トースト ── */
    var _toastTimer = null;
    function flash(msg) {
      var el = document.getElementById('toast');
      if (!el) return;
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(function() { el.classList.remove('show'); }, 2200);
    }

    /* ── タイマー ── */
    setInterval(function() {
      var sec = 30;
      st.onaka  = clamp(st.onaka  - DECAY.onaka  * sec);
      st.suimin = clamp(st.suimin - DECAY.suimin * sec);
      st.yaruki = clamp(st.yaruki - DECAY.yaruki * sec);
      fluctuateKibun();
      save();
      render();
      if (!_speechLock) autoSpeech();
    }, 30 * 1000);

    setInterval(updateCD, 10 * 1000);

    setInterval(function() {
      if (!_speechLock) autoSpeech();
    }, 2 * 60 * 1000);

    /* ── 雪アニメーション ── */
    (function() {
      var canvas = document.getElementById('snow-canvas');
      var ctx = canvas.getContext('2d');
      var flakes = [];
      var N = 60;

      function resize() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      for (var i = 0; i < N; i++) {
        flakes.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          r: Math.random() * 2.5 + 0.5,
          sp: Math.random() * 0.8 + 0.3,
          sw: Math.random() * 0.6 - 0.3,
          op: Math.random() * 0.4 + 0.1
        });
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        flakes.forEach(function(f) {
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,' + f.op + ')';
          ctx.fill();
          f.y += f.sp;
          f.x += f.sw;
          if (f.y > canvas.height + 5) {
            f.y = -5;
            f.x = Math.random() * canvas.width;
          }
          if (f.x > canvas.width + 5)  f.x = -5;
          if (f.x < -5) f.x = canvas.width + 5;
        });
        requestAnimationFrame(draw);
      }
      draw();
    })();

    /* ── BGM ── */
    var _muted = false;

    /* ── 起動 ── */
    load();
    render();
    autoSpeech();

    /* ── ホームに追加 ── */
    (function() {
      var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
      var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
      if (isStandalone) return; // すでにホーム追加済み

      if (isIOS) {
        document.getElementById('ios-a2hs').style.display = 'block';
      } else {
        var _deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          _deferredPrompt = e;
          document.getElementById('a2hs-bar').style.display = 'block';
        });
        document.getElementById('a2hs-btn').addEventListener('click', function() {
          if (!_deferredPrompt) return;
          _deferredPrompt.prompt();
          _deferredPrompt.userChoice.then(function() {
            _deferredPrompt = null;
            document.getElementById('a2hs-bar').style.display = 'none';
          });
        });
      }
    })();

    /* ── DATA BACKUP (Supabase) ── */
    (function() {
      var SB_URL = 'https://pjmqunhjyafzqjxwyunb.supabase.co';
      var SB_KEY = 'sb_publishable_kMNnLJ9VR6fW02U9CANbkQ_FGVjUpY7';
      var API    = SB_URL + '/rest/v1/sf_user_data';

      function sbH(extra) {
        var h = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };
        if (extra) Object.assign(h, extra);
        return h;
      }

      function getKey() {
        var id  = (document.getElementById('backup-id').value  || '').trim();
        var pin = (document.getElementById('backup-pin').value || '').trim();
        return { id: id, pin: pin, key: 'hayate_' + id + ':' + pin };
      }

      function setMsg(txt, col) {
        var el = document.getElementById('backup-msg');
        if (el) { el.textContent = txt; el.style.color = col || '#64748b'; }
      }

      window.backupSave = async function() {
        var k = getKey();
        if (!k.id)            { setMsg('IDを入力してください', '#f87171'); return; }
        if (!/^\d{4}$/.test(k.pin)) { setMsg('PINは数字4桁で入力してください', '#f87171'); return; }
        setMsg('保存中…');
        try {
          var res = await fetch(API, {
            method: 'POST',
            headers: sbH({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
            body: JSON.stringify({ email: k.key, payload: { hayatecchi: JSON.stringify(st) }, updated_at: new Date().toISOString() })
          });
          if (res.ok) { setMsg('保存しました！', '#6ee7b7'); }
          else        { setMsg('保存に失敗しました', '#f87171'); }
        } catch(e)  { setMsg('通信エラー', '#f87171'); }
      };

      window.backupRestore = async function() {
        var k = getKey();
        if (!k.id)            { setMsg('IDを入力してください', '#f87171'); return; }
        if (!/^\d{4}$/.test(k.pin)) { setMsg('PINは数字4桁で入力してください', '#f87171'); return; }
        setMsg('復元中…');
        try {
          var res = await fetch(API + '?email=eq.' + encodeURIComponent(k.key) + '&select=payload&limit=1', { headers: sbH() });
          var data = await res.json();
          if (data && data[0] && data[0].payload && data[0].payload.hayatecchi) {
            var saved = JSON.parse(data[0].payload.hayatecchi);
            st = saved;
            if (!st.cd) st.cd = {};
            save();
            render();
            setMsg('復元しました！', '#6ee7b7');
          } else {
            setMsg('データが見つかりません', '#f87171');
          }
        } catch(e) { setMsg('通信エラー', '#f87171'); }
      };
    })();
  </script>
