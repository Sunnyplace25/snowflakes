<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ハヤテっち｜購入ありがとうございます</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      min-height: 100vh;
      background: #0c1220;
      color: #e2e8f0;
      font-family: 'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
      display: flex; align-items: center; justify-content: center;
    }
    .wrap {
      max-width: 320px; width: calc(100% - 48px);
      text-align: center; padding: 48px 0;
    }
    .snowflake {
      font-size: 32px; opacity: 0.5; margin-bottom: 28px;
      animation: spin 12s linear infinite;
    }
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

    .label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px; letter-spacing: 6px; color: #fde68a;
      margin-bottom: 16px;
    }
    .title {
      font-size: 20px; font-weight: 300; color: white;
      line-height: 1.8; margin-bottom: 8px;
    }
    .sub {
      font-size: 12px; color: #475569; letter-spacing: 1px;
      line-height: 2; margin-bottom: 40px;
    }

    .pw-block {
      background: rgba(253,230,138,0.05);
      border: 1px solid rgba(253,230,138,0.2);
      border-radius: 16px;
      padding: 28px 24px;
      margin-bottom: 32px;
    }
    .pw-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 9px; letter-spacing: 5px; color: #94a3b8;
      margin-bottom: 14px;
    }
    .pw-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px; letter-spacing: 10px; color: #fde68a;
      margin-bottom: 10px;
      user-select: all;
    }
    .pw-hint {
      font-size: 11px; color: #475569; letter-spacing: 1px; line-height: 2;
    }

    .copy-btn {
      display: inline-block;
      padding: 8px 24px;
      background: rgba(253,230,138,0.08);
      border: 1px solid rgba(253,230,138,0.25);
      border-radius: 100px;
      color: #fde68a;
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px; letter-spacing: 4px;
      cursor: pointer; transition: all 0.2s;
      margin-bottom: 32px;
    }
    .copy-btn:hover { background: rgba(253,230,138,0.15); }
    .copy-btn.copied { color: #6ee7b7; border-color: rgba(110,231,183,0.3); background: rgba(110,231,183,0.06); }

    .go-btn {
      display: inline-block;
      padding: 12px 36px;
      background: rgba(253,230,138,0.1);
      border: 1.5px solid rgba(253,230,138,0.4);
      border-radius: 100px;
      color: #fde68a;
      font-family: 'Noto Serif JP', serif;
      font-size: 14px; font-weight: 300;
      text-decoration: none;
      cursor: pointer; transition: all 0.2s;
      margin-bottom: 12px;
      display: block; width: 100%;
    }
    .go-btn:hover { background: rgba(253,230,138,0.18); }

    .back {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px; letter-spacing: 3px; color: #334155;
      text-decoration: none; transition: color 0.2s;
    }
    .back:hover { color: #64748b; }

    .note {
      margin-top: 36px;
      font-size: 11px; color: #334155; letter-spacing: 1px; line-height: 2.2;
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="snowflake">❄</div>
  <p class="label">THANK YOU</p>
  <p class="title">ありがとうございます</p>
  <p class="sub">ハヤテっちを購入してくれて。<br>これでいつでもハヤテに会いにいける。</p>

  <div class="pw-block">
    <p class="pw-label">PASSWORD</p>
    <p class="pw-value" id="pw-text">HARDGUMI</p>
    <p class="pw-hint">ことりファクトリーの<br>ハヤテっちカードに入力してね</p>
  </div>

  <button class="copy-btn" id="copy-btn" onclick="copyPW()">コピー</button>

  <a class="go-btn" href="kotori.html">ことりファクトリーへ →</a>
  <a class="back" href="index.html">← Snow flakes トップ</a>

  <p class="note">
    パスワードはどこかにメモしておくと安心です。<br>
    再購入は不要です。いつでも使えます。
  </p>
</div>

<script>
  // パスワードをlocalStorageに保存しておく（ことりファクトリーの入力補助）
  localStorage.setItem('ht_unlocked', '1');

  function copyPW() {
    var btn = document.getElementById('copy-btn');
    navigator.clipboard.writeText('HARDGUMI').then(function() {
      btn.textContent = 'コピーしました';
      btn.classList.add('copied');
      setTimeout(function() {
        btn.textContent = 'コピー';
        btn.classList.remove('copied');
      }, 2000);
    }).catch(function() {
      // fallback: select text
      var el = document.getElementById('pw-text');
      var range = document.createRange();
      range.selectNode(el);
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);
    });
  }
</script>
</body>
</html>
