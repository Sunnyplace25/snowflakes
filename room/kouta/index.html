<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>コウタの部屋 | Snow flakes</title>
  <link rel="icon" href="../../favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
  <script src="../../snow.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080f1e;
      color: #e2e8f0;
      font-family: 'Noto Serif JP', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      bottom: -80px; left: 50%;
      transform: translateX(-50%);
      width: 480px; height: 320px;
      background: radial-gradient(ellipse, rgba(252,165,165,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .nav {
      width: 100%; max-width: 480px;
      padding: 22px 22px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .back {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px; letter-spacing: 3px;
      color: #475569; text-decoration: none;
      transition: color 0.2s;
    }
    .back:hover { color: #94a3b8; }
    .snow-badge {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px; letter-spacing: 3px;
      color: #475569;
    }
    .snow-badge .sf-snow-val { color: #fca5a5; }

    .main {
      flex: 1;
      width: 100%; max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 24px 48px;
      position: relative;
    }

    .eyebrow {
      font-family: 'Cormorant Garamond', serif;
      font-size: 9px; letter-spacing: 6px;
      color: #475569;
      margin-bottom: 32px;
    }

    .chara-wrap {
      position: relative;
      width: 220px;
      margin-bottom: 32px;
    }
    .chara-wrap::after {
      content: '';
      position: absolute;
      bottom: -12px; left: 50%;
      transform: translateX(-50%);
      width: 100px; height: 16px;
      background: radial-gradient(ellipse, rgba(252,165,165,0.35) 0%, transparent 70%);
    }
    .chara-img { width: 100%; display: block; }

    .name-en {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px; letter-spacing: 8px;
      color: #475569;
      margin-bottom: 10px;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px; font-weight: 300;
      letter-spacing: 8px;
      color: #fca5a5;
      margin-bottom: 8px;
    }
    .role {
      font-size: 10px; letter-spacing: 4px;
      color: #475569;
      margin-bottom: 40px;
    }

    .divider {
      width: 40px; height: 1px;
      background: rgba(252,165,165,0.25);
      margin-bottom: 32px;
    }

    .profile-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: rgba(252,165,165,0.08);
      border: 1px solid rgba(252,165,165,0.08);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 40px;
    }
    .profile-item {
      background: rgba(8,15,30,0.9);
      padding: 18px 16px;
    }
    .profile-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 9px; letter-spacing: 4px;
      color: #475569;
      margin-bottom: 6px;
    }
    .profile-val {
      font-size: 12px; letter-spacing: 2px;
      color: #94a3b8;
    }

    .quote {
      font-size: 12px; line-height: 2.2;
      letter-spacing: 1px;
      color: #475569;
      text-align: center;
      font-style: italic;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="../../sweets/" class="back">← SWEETs</a>
    <span class="snow-badge">❄ <span class="sf-snow-val">0</span></span>
  </nav>

  <div class="main">
    <img src="room_top.webp" alt="KOUTA" style="width:calc(100% + 48px);max-width:calc(480px + 48px);display:block;margin:-32px -24px 32px;object-fit:cover;border-radius:0 0 24px 24px;">

    <p class="eyebrow">Snow flakes — ROOM</p>

    <div class="chara-wrap">
      <img src="../../plofile/コウタ透過.png" alt="KOUTA" class="chara-img">
    </div>

    <p class="name-en">KOUTA</p>
    <h1>コウタの部屋</h1>
    <p class="role">bass</p>

    <div class="divider"></div>

    <div class="profile-grid">
      <div class="profile-item">
        <p class="profile-label">HAIR</p>
        <p class="profile-val">red</p>
      </div>
      <div class="profile-item">
        <p class="profile-label">PART</p>
        <p class="profile-val">bass</p>
      </div>
      <div class="profile-item">
        <p class="profile-label">CANDY</p>
        <p class="profile-val">honey lemon</p>
      </div>
      <div class="profile-item">
        <p class="profile-label">IMAGE</p>
        <p class="profile-val">low frequency</p>
      </div>
    </div>

    <p class="quote">言葉より先に、音が来る。</p>

    <p style="font-family:'Cormorant Garamond',serif;font-size:10px;letter-spacing:4px;color:#475569;margin-top:40px;text-align:center;">コンテンツ追加準備中</p>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      SfSnow.updateUI();
    });
  </script>
</body>
</html>
