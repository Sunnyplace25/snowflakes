<script>
  function shareMusic() {
    var url = 'https://sunnyplace25.github.io/snowflakes/music.html';
    var text = 'Snow flakes — Music';
    if (navigator.share) {
      navigator.share({ title: text, url: url }).catch(function(){});
    } else {
      navigator.clipboard.writeText(url).then(function() {
        var toast = document.getElementById('share-toast');
        toast.style.display = 'block';
        setTimeout(function() { toast.style.display = 'none'; }, 2000);
      });
    }
  }

  const canvas = document.getElementById('snow');
  const ctx = canvas.getContext('2d');
  function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
  window.addEventListener('resize', resize); resize();
  const flakes = Array.from({length: 50}, () => ({
    x: Math.random()*innerWidth, y: Math.random()*innerHeight,
    r: Math.random()*1.6+0.4, speed: Math.random()*0.5+0.15,
    drift: (Math.random()-0.5)*0.25
  }));
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#fff';
    for (const f of flakes) {
      ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,Math.PI*2); ctx.fill();
      f.y+=f.speed; f.x+=f.drift;
      if(f.y>canvas.height+4){f.y=-4;f.x=Math.random()*canvas.width;}
      if(f.x<-4)f.x=canvas.width+4;
      if(f.x>canvas.width+4)f.x=-4;
    }
    requestAnimationFrame(draw);
  }
  draw();
</script>
<!-- ── GA: 配信サービスリンク計測 ── -->
<script>
(function() {
  function sfGa(name, params) {
    if (typeof gtag === 'function') gtag('event', name, params);
  }
  var MUSIC_MAP = [
    { pattern: /open\.spotify\.com/,  name: 'click_spotify', params: { destination: 'spotify' } },
    { pattern: /music\.apple\.com/,   name: 'click_music',   params: { destination: 'apple_music' } },
    { pattern: /music\.amazon/,       name: 'click_music',   params: { destination: 'amazon_music' } },
    { pattern: /music\.youtube\.com/, name: 'click_youtube', params: { destination: 'youtube_music' } },
    { pattern: /youtube\.com/,        name: 'click_youtube', params: { destination: 'youtube' } },
  ];
  document.addEventListener('click', function(e) {
    var a = e.target.closest('a[href]');
    if (!a) return;
    var href = a.href || '';
    for (var i = 0; i < MUSIC_MAP.length; i++) {
      if (MUSIC_MAP[i].pattern.test(href)) {
        sfGa(MUSIC_MAP[i].name, Object.assign({}, MUSIC_MAP[i].params, { url: href.slice(0, 100) }));
        return;
      }
    }
  });
})();
</script>
