<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日の音 | Snow flakes</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0c1220;
      color: #e2e8f0;
      font-family: 'Noto Serif JP', serif;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      padding: 80px 20px 60px;
      overflow-x: hidden;
    }

    #snow { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

    .back-link {
      position: fixed; top: 22px; left: 22px; z-index: 50;
      color: #64748b; font-size: 11px; letter-spacing: 3px;
      text-decoration: none; font-family: 'Cormorant Garamond', serif;
      transition: color 0.3s;
    }
    .back-link:hover { color: #93c5fd; }

    /* ── Page head ── */
    .page-head {
      text-align: center; margin-bottom: 44px; z-index: 1; position: relative;
    }
    .page-eyebrow {
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px; letter-spacing: 5px; color: #94a3b8; margin-bottom: 10px;
    }
    .page-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px; font-weight: 300; letter-spacing: 5px;
      color: rgba(255,255,255,0.9);
    }

    /* ── Machine ── */
    .machine-wrap {
      display: flex; flex-direction: column; align-items: center;
      z-index: 1; position: relative;
    }

    .machine-dome {
      width: 210px; height: 210px; border-radius: 50%;
      background: radial-gradient(circle at 38% 30%,
        rgba(255,255,255,0.22) 0%,
        rgba(147,197,253,0.08) 40%,
        rgba(12,18,32,0.6) 100%);
      border: 2px solid rgba(255,255,255,0.35);
      position: relative; overflow: hidden;
      box-shadow:
        0 0 0 6px rgba(255,255,255,0.04),
        0 0 40px rgba(147,197,253,0.25),
        0 0 80px rgba(147,197,253,0.1),
        inset 0 0 60px rgba(147,197,253,0.08);
    }
    /* glass highlight */
    .machine-dome::after {
      content: '';
      position: absolute; top: 8%; left: 14%;
      width: 38%; height: 28%;
      background: radial-gradient(ellipse, rgba(255,255,255,0.18) 0%, transparent 80%);
      border-radius: 50%;
      pointer-events: none;
    }
    .mini-cap {
      position: absolute; width: 18px; height: 18px; border-radius: 50%;
      animation: floatCap linear infinite;
      box-shadow: 0 0 8px currentColor;
    }
    @keyframes floatCap {
      0%   { transform: translateY(230px) rotate(0deg);   opacity: 0; }
      8%   { opacity: 0.75; }
      88%  { opacity: 0.5; }
      100% { transform: translateY(-40px) rotate(240deg); opacity: 0; }
    }

    .machine-neck {
      width: 40px; height: 28px;
      background: rgba(255,255,255,0.06);
      border-left: 2px solid rgba(255,255,255,0.18);
      border-right: 2px solid rgba(255,255,255,0.18);
    }
    .machine-base {
      width: 250px;
      background: rgba(255,255,255,0.07);
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 20px; padding: 22px 24px 24px;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      box-shadow: 0 0 30px rgba(147,197,253,0.08);
    }
    .machine-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px; letter-spacing: 6px; color: rgba(255,255,255,0.6);
    }
    .daily-note { font-size: 11px; color: #94a3b8; letter-spacing: 1px; min-height: 18px; }

    .lever-btn {
      width: 100%;
      background: rgba(147,197,253,0.12);
      border: 1px solid rgba(147,197,253,0.45);
      border-radius: 50px; padding: 14px 0;
      color: #bfdbfe; font-family: 'Cormorant Garamond', serif;
      font-size: 16px; letter-spacing: 5px; cursor: pointer;
      transition: all 0.25s;
    }
    .lever-btn:hover:not(:disabled) {
      background: rgba(147,197,253,0.22);
      box-shadow: 0 0 24px rgba(147,197,253,0.25);
    }
    .lever-btn:active:not(:disabled) { transform: scale(0.97); }
    .lever-btn:disabled { opacity: 0.3; cursor: default; color: #475569; border-color: rgba(255,255,255,0.08); }

    /* ── Saved & Replay ── */
    .below-machine {
      margin-top: 28px; z-index: 1; position: relative;
      text-align: center;
      opacity: 0; pointer-events: none; transition: opacity 0.6s;
    }
    .below-machine.show { opacity: 1; pointer-events: auto; }

    .text-btn {
      font-family: 'Noto Serif JP', serif; font-size: 12px;
      letter-spacing: 2px; color: #94a3b8; background: none; border: none;
      cursor: pointer; text-decoration: underline;
      text-underline-offset: 4px; transition: color 0.3s;
    }
    .text-btn:hover { color: #cbd5e1; }

    .mini-result { margin-top: 20px; min-height: 56px; opacity: 0; transition: opacity 0.5s; }
    .mini-result.show { opacity: 1; }
    .mini-fortune-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 30px; letter-spacing: 3px; margin-bottom: 6px;
    }
    .mini-fortune-msg { font-size: 13px; color: #94a3b8; line-height: 2; }
    .mini-again {
      margin-top: 14px; font-size: 11px; letter-spacing: 2px; color: #64748b;
      font-family: 'Noto Serif JP', serif; background: none; border: none;
      cursor: pointer; text-decoration: underline; text-underline-offset: 4px;
      transition: color 0.3s;
    }
    .mini-again:hover { color: #64748b; }

    /* ── Capsule overlay ── */
    .cap-overlay {
      position: fixed; inset: 0; z-index: 300;
      display: flex; align-items: center; justify-content: center;
      background: transparent; pointer-events: none;
      transition: background 0.35s;
    }
    .cap-overlay.dim { background: rgba(12,18,32,0.72); pointer-events: auto; }

    .capsule {
      width: 100px; height: 100px; border-radius: 50%;
      position: relative; overflow: hidden;
      transform: translateY(-320px) rotate(-8deg); opacity: 0;
    }
    .capsule.drop { animation: capDrop 0.72s cubic-bezier(.18,1.3,.48,1) forwards; }
    @keyframes capDrop {
      0%  { transform: translateY(-320px) rotate(-8deg); opacity: 0; }
      38% { opacity: 1; }
      68% { transform: translateY(0) rotate(4deg); opacity: 1; }
      82% { transform: translateY(-16px) rotate(-2deg); }
      100%{ transform: translateY(0) rotate(0deg); opacity: 1; }
    }
    .capsule.drop.char-hayate { animation: capDropH 0.58s cubic-bezier(.15,1.55,.45,1) forwards; }
    @keyframes capDropH {
      0%  { transform: translateY(-320px) rotate(-15deg); opacity: 0; }
      32% { opacity: 1; }
      62% { transform: translateY(0) rotate(7deg); }
      74% { transform: translateY(-26px) rotate(-4deg); }
      84% { transform: translateY(8px) rotate(2deg); }
      100%{ transform: translateY(0) rotate(0deg); opacity: 1; }
    }

    .cap-top, .cap-bottom {
      position: absolute; width: 100px; height: 50px;
    }
    .cap-top {
      top: 0;
      background: var(--cap-clr, rgba(147,197,253,0.7));
      box-shadow: inset 0 8px 18px rgba(255,255,255,0.25);
      transition: transform 0.55s ease;
    }
    .cap-bottom {
      bottom: 0;
      background: rgba(255,255,255,0.15);
      border-top: 1px solid rgba(255,255,255,0.25);
      transition: transform 0.55s ease;
    }
    /* snow mark */
    .cap-snow {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 30px; z-index: 2; pointer-events: none;
      transition: opacity 0.25s ease;
      text-shadow: 0 0 12px rgba(255,255,255,0.6);
    }
    .capsule.open .cap-snow { opacity: 0; }

    /* open flash */
    .cap-flash {
      position: fixed; inset: 0; z-index: 350;
      background: rgba(255,255,255,0);
      pointer-events: none;
      transition: background 0.08s ease;
    }
    .cap-flash.burst { background: rgba(255,255,255,0.18); }
    .cap-flash.fade  { background: rgba(255,255,255,0); transition: background 0.5s ease; }

    /* hinata: slow */
    .capsule.char-hinata .cap-top    { transition: transform 0.75s ease 0.15s; }
    .capsule.char-hinata .cap-bottom { transition: transform 0.75s ease 0.15s; }
    /* kouta: pop */
    .capsule.char-kouta .cap-top    { transition: transform 0.42s cubic-bezier(.18,1.25,.45,1); }
    .capsule.char-kouta .cap-bottom { transition: transform 0.42s cubic-bezier(.18,1.25,.45,1); }
    /* hayate: snap */
    .capsule.char-hayate .cap-top    { transition: transform 0.28s cubic-bezier(.15,1.6,.4,1); }
    .capsule.char-hayate .cap-bottom { transition: transform 0.28s cubic-bezier(.15,1.6,.4,1); }

    .capsule.open .cap-top    { transform: translateY(-50px); }
    .capsule.open .cap-bottom { transform: translateY(50px); }
    .capsule.char-hayate.open .cap-top    { transform: translateY(-60px); }
    .capsule.char-hayate.open .cap-bottom { transform: translateY(60px); }

    /* ── Result overlay ── */
    .result-overlay {
      position: fixed; inset: 0; z-index: 400;
      background: rgba(12,18,32,0.9);
      backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
    }
    .result-overlay.show { opacity: 1; pointer-events: auto; }

    .result-card {
      background: rgba(13,21,38,0.97);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 26px;
      padding: 36px 28px 28px;
      width: 100%; max-width: 340px;
      text-align: center;
      transform: translateY(20px) scale(0.96);
      transition: transform 0.5s ease;
      position: relative; overflow: hidden;
    }
    .result-overlay.show .result-card { transform: none; }

    .result-card::before {
      content: '';
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(circle at 50% 0%,
        var(--glow, rgba(147,197,253,0.07)) 0%, transparent 65%);
    }

    /* fortune section */
    .res-eyebrow {
      font-family: 'Cormorant Garamond', serif;
      font-size: 9px; letter-spacing: 5px; color: #64748b; margin-bottom: 12px;
    }
    .res-fortune-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 50px; font-weight: 300; letter-spacing: 4px; line-height: 1;
      color: var(--fclr, #93c5fd); margin-bottom: 16px;
    }
    .card-sep {
      width: 32px; height: 1px; background: rgba(255,255,255,0.18);
      margin: 0 auto 20px;
    }

    /* character block */
    .res-char {
      display: flex; align-items: center; gap: 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px; padding: 14px;
      margin-bottom: 12px; text-align: left;
    }
    .res-char img { width: 68px; flex-shrink: 0; }
    .res-char-info { flex: 1; }
    .res-char-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 12px; letter-spacing: 4px; margin-bottom: 8px;
    }
    .res-char-line {
      font-size: 13px; color: #94a3b8; line-height: 1.95; font-weight: 300;
    }
    /* hinata: delayed word reveal */
    .res-char.char-hinata .res-char-line {
      animation: wordReveal 1.1s ease 0.7s both;
    }
    @keyframes wordReveal {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: none; }
    }

    /* lucky grid */
    .lucky-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px; margin-bottom: 22px;
    }
    .lucky-item {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px; padding: 14px 12px; text-align: left;
    }
    .lucky-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 8px; letter-spacing: 4px; color: #64748b; margin-bottom: 8px;
    }
    .lucky-value {
      font-family: 'Noto Serif JP', serif;
      font-size: 13px; color: #cbd5e1; line-height: 1.7; font-weight: 300;
    }

    .close-btn {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 50px; padding: 13px 0;
      color: #64748b; font-family: 'Cormorant Garamond', serif;
      font-size: 12px; letter-spacing: 3px; cursor: pointer;
      transition: all 0.25s;
    }
    .close-btn:hover { color: #94a3b8; border-color: rgba(255,255,255,0.22); }

    /* ── Mobile ── */
    @media (max-width: 480px) {
      body { padding: 65px 16px 50px; }
      .machine-dome { width: 160px; height: 160px; }
      .machine-base { width: 200px; }
      .res-fortune-name { font-size: 42px; }
      .res-char img { width: 58px; }
      .result-card { padding: 28px 20px 22px; }
    }
  </style>
</head>
<body>
<canvas id="snow"></canvas>
<a class="back-link" href="../">← SNOW FLAKES</a>

<div class="page-head">
  <p class="page-eyebrow">SNOW FLAKES</p>
  <h1 class="page-title">今日の音</h1>
</div>

<div class="machine-wrap">
  <div class="machine-dome" id="dome"></div>
  <div class="machine-neck"></div>
  <div class="machine-base">
    <p class="machine-label">DAILY GACHA</p>
    <p class="daily-note" id="dailyNote"></p>
    <button class="lever-btn" id="leverBtn">まわす</button>
  </div>
</div>

<div class="below-machine" id="belowMachine">
  <button class="text-btn" id="savedViewBtn" style="display:none">今日の結果を見る</button>
  <button class="text-btn" id="replayBtn">もう一回まわす？</button>
  <div class="mini-result" id="miniResult">
    <p class="mini-fortune-name" id="miniFortuneName"></p>
    <p class="mini-fortune-msg" id="miniFortuneMsg"></p>
    <button class="mini-again" id="miniAgainBtn">もう一回</button>
  </div>
</div>

<!-- Capsule -->
<div class="cap-flash" id="capFlash"></div>
<div class="cap-overlay" id="capOverlay">
  <div class="capsule" id="capsule">
    <div class="cap-top"></div>
    <div class="cap-bottom"></div>
    <div class="cap-snow">❄</div>
  </div>
</div>

<!-- Result card -->
<div class="result-overlay" id="resultOverlay">
  <div class="result-card" id="resultCard">
    <p class="res-eyebrow">TODAY'S OTO</p>
    <p class="res-fortune-name" id="resFortuneName"></p>
    <div class="card-sep"></div>
    <div class="res-char" id="resCharBlock">
      <img id="resCharImg" src="" alt="">
      <div class="res-char-info">
        <p class="res-char-name" id="resCharName"></p>
        <p class="res-char-line" id="resCharLine"></p>
      </div>
    </div>
    <div class="lucky-grid">
      <div class="lucky-item">
        <p class="lucky-label">LUCKY SWEETS</p>
        <p class="lucky-value" id="resSweets"></p>
      </div>
      <div class="lucky-item">
        <p class="lucky-label">LUCKY MUSIC</p>
        <p class="lucky-value" id="resMusic"></p>
      </div>
    </div>
    <button class="close-btn" id="closeBtn">閉じる</button>
  </div>
</div>

<script>
(function () {

  /* ── FORTUNE DATA ── */
  var FORTUNES = [
    // HINATA (blue)
    { name:'余白',  char:'hinata', color:'#c4b5fd', line:'急がなくていい日かもしれない',          sweets:'ミルクプリン',      music:'Still' },
    { name:'静音',  char:'hinata', color:'#7dd3fc', line:'少し静かな場所が、ちゃんと落ち着く',    sweets:'ラムネ',            music:'置いた音' },
    { name:'微光',  char:'hinata', color:'#bae6fd', line:'見えにくいだけで、消えてない',          sweets:'ホワイトチョコ',    music:'透明のまま' },
    { name:'青星',  char:'hinata', color:'#93c5fd', line:'夜に、小さないいことがあるかも',        sweets:'ソーダアイス',      music:'夜の底で' },
    { name:'夜凪',  char:'hinata', color:'#60a5fa', line:'考えすぎる前に、少し休もう',            sweets:'カフェラテプリン',  music:'白いまま' },
    // KOUTA (red/warm)
    { name:'甘日和', char:'kouta', color:'#f9a8d4', line:'今日は、甘やかされてもいい',           sweets:'生チョコ',          music:'SWEETs' },
    { name:'灯火',  char:'kouta', color:'#fca5a5', line:'ちゃんと休むと、少し戻る',              sweets:'焼きプリン',        music:'Round Bounce' },
    { name:'微熱',  char:'kouta', color:'#fda4af', line:'頑張りすぎる前に、ひと息',              sweets:'いちごドーナツ',    music:'約束はしない' },
    { name:'赤音',  char:'kouta', color:'#f87171', line:'今日は、ちゃんと食べた方がいい',        sweets:'フォンダンショコラ', music:'グラスの縁' },
    { name:'半歩',  char:'kouta', color:'#fdba74', line:'少し進めたなら、それで十分',            sweets:'たい焼き',          music:'名前のない歌' },
    // HAYATE (yellow)
    { name:'陽だまり', char:'hayate', color:'#fde68a', line:'ちょっとくらい楽しい方選べ！',      sweets:'メロンソーダ',      music:'Spring Waltz' },
    { name:'跳躍',  char:'hayate', color:'#fef08a', line:'勢いで行く日があってもいい！',         sweets:'レモンケーキ',      music:'Rabbit' },
    { name:'黄風',  char:'hayate', color:'#fcd34d', line:'今日は、笑ったもん勝ち！',             sweets:'カスタードたい焼き', music:'Low Light' },
    { name:'閃光',  char:'hayate', color:'#fbbf24', line:'寄り道した先に当たりあるかも！',       sweets:'パチパチキャンディ', music:'Little Snow' },
    { name:'晴間',  char:'hayate', color:'#fde047', line:'なんとかなる日って、ちゃんとある！',   sweets:'シュークリーム',    music:'Round Bounce' },
  ];

  var CHAR_META = {
    hinata: { img:'../plofile/chibi_hinata.png', capClr:'rgba(147,197,253,0.55)', glow:'rgba(147,197,253,0.07)' },
    kouta:  { img:'../plofile/chibi_kouta.png',  capClr:'rgba(252,165,165,0.55)', glow:'rgba(252,165,165,0.07)' },
    hayate: { img:'../plofile/chibi_hayate.png', capClr:'rgba(253,230,138,0.55)', glow:'rgba(253,230,138,0.06)' },
  };

  /* ── STORAGE ── */
  var todayKey = 'sf_gacha_' + new Date().toLocaleDateString('ja-JP');
  function loadSaved() { try { return JSON.parse(localStorage.getItem(todayKey)); } catch(e) { return null; } }
  function save(data) { try { localStorage.setItem(todayKey, JSON.stringify(data)); } catch(e) {} }

  /* ── DOM ── */
  var leverBtn     = document.getElementById('leverBtn');
  var dailyNote    = document.getElementById('dailyNote');
  var belowMachine = document.getElementById('belowMachine');
  var savedViewBtn = document.getElementById('savedViewBtn');
  var replayBtn    = document.getElementById('replayBtn');
  var miniResult   = document.getElementById('miniResult');
  var miniFortuneName = document.getElementById('miniFortuneName');
  var miniFortuneMsg  = document.getElementById('miniFortuneMsg');
  var miniAgainBtn = document.getElementById('miniAgainBtn');
  var capOverlay   = document.getElementById('capOverlay');
  var capFlash     = document.getElementById('capFlash');
  var capsuleEl    = document.getElementById('capsule');
  var capTopEl     = capsuleEl.querySelector('.cap-top');
  var resultOverlay = document.getElementById('resultOverlay');

  /* ── Mini capsules in dome ── */
  var dome = document.getElementById('dome');
  ['rgba(147,197,253,0.38)','rgba(252,165,165,0.38)','rgba(253,230,138,0.38)'].forEach(function(clr, ci) {
    for (var i = 0; i < 3; i++) {
      var m = document.createElement('div');
      m.className = 'mini-cap';
      m.style.cssText = 'background:' + clr + ';left:' + (12 + Math.random()*68) + '%;animation-duration:' + (5 + Math.random()*6) + 's;animation-delay:' + (-Math.random()*9) + 's;';
      dome.appendChild(m);
    }
  });

  /* ── Show full result card ── */
  function showResult(fortune) {
    var meta = CHAR_META[fortune.char];
    document.getElementById('resFortuneName').textContent = fortune.name;
    document.getElementById('resFortuneName').style.color = fortune.color;
    document.getElementById('resCharImg').src  = meta.img;
    document.getElementById('resCharImg').alt  = fortune.char;
    document.getElementById('resCharName').textContent = fortune.char.toUpperCase();
    document.getElementById('resCharName').style.color = fortune.color;
    document.getElementById('resCharLine').textContent = fortune.line;
    document.getElementById('resSweets').textContent   = fortune.sweets;
    document.getElementById('resMusic').textContent    = fortune.music;

    var block = document.getElementById('resCharBlock');
    block.className = 'res-char char-' + fortune.char;
    var card  = document.getElementById('resultCard');
    card.style.setProperty('--glow',  meta.glow);
    card.style.setProperty('--fclr',  fortune.color);

    resultOverlay.classList.add('show');
  }

  document.getElementById('closeBtn').addEventListener('click', function() {
    resultOverlay.classList.remove('show');
    belowMachine.classList.add('show');
    replayBtn.style.display = '';
  });

  savedViewBtn.addEventListener('click', function() {
    var d = loadSaved();
    if (d) showResult(d);
  });

  /* ── Capsule animation ── */
  function runCapsule(fortune, onDone) {
    var meta = CHAR_META[fortune.char];
    capsuleEl.className = 'capsule char-' + fortune.char;
    capTopEl.style.background = meta.capClr;
    capOverlay.classList.add('dim');

    requestAnimationFrame(function() {
      requestAnimationFrame(function() { capsuleEl.classList.add('drop'); });
    });

    var openDelay = fortune.char === 'hayate' ? 630 : 740;
    var showDelay = fortune.char === 'hinata' ? 900 : fortune.char === 'hayate' ? 380 : 520;

    setTimeout(function() {
      capsuleEl.classList.add('open');
      // flash on open
      capFlash.classList.add('burst');
      setTimeout(function() { capFlash.classList.remove('burst'); capFlash.classList.add('fade'); }, 80);
      setTimeout(function() { capFlash.classList.remove('fade'); }, 600);
      setTimeout(function() {
        capOverlay.classList.remove('dim');
        capsuleEl.className = 'capsule';
        onDone();
      }, showDelay);
    }, openDelay);
  }

  /* ── First (daily) pull ── */
  leverBtn.addEventListener('click', function() {
    leverBtn.disabled = true;
    var fortune = FORTUNES[Math.floor(Math.random() * FORTUNES.length)];
    save(fortune);
    runCapsule(fortune, function() {
      showResult(fortune);
      dailyNote.textContent = '今日の1回は引きました';
    });
  });

  /* ── Replay (extra) pulls ── */
  var usedReplay = [];
  function replayFortune() {
    if (usedReplay.length >= FORTUNES.length) usedReplay = [];
    var pool = FORTUNES.filter(function(f) { return usedReplay.indexOf(f.name) === -1; });
    var f = pool[Math.floor(Math.random() * pool.length)];
    usedReplay.push(f.name);
    return f;
  }

  replayBtn.addEventListener('click', function() {
    miniResult.classList.remove('show');
    replayBtn.style.display = 'none';
    var f = replayFortune();
    var meta = CHAR_META[f.char];

    capsuleEl.className = 'capsule char-' + f.char;
    capTopEl.style.background = meta.capClr;
    capOverlay.classList.add('dim');
    requestAnimationFrame(function() {
      requestAnimationFrame(function() { capsuleEl.classList.add('drop'); });
    });
    setTimeout(function() {
      capsuleEl.classList.add('open');
      capFlash.classList.add('burst');
      setTimeout(function() { capFlash.classList.remove('burst'); capFlash.classList.add('fade'); }, 80);
      setTimeout(function() { capFlash.classList.remove('fade'); }, 600);
      setTimeout(function() {
        capOverlay.classList.remove('dim');
        capsuleEl.className = 'capsule';
        miniFortuneName.textContent = f.name;
        miniFortuneName.style.color = f.color;
        miniFortuneMsg.textContent  = f.line;
        miniResult.classList.add('show');
        replayBtn.style.display = '';
      }, 420);
    }, 680);
  });

  miniAgainBtn.addEventListener('click', function() {
    miniResult.classList.remove('show');
    setTimeout(function() { replayBtn.click(); }, 260);
  });

  /* ── Init ── */
  var saved = loadSaved();
  if (saved) {
    leverBtn.disabled = true;
    dailyNote.textContent = '今日の1回は引きました';
    savedViewBtn.style.display = '';
    belowMachine.classList.add('show');
    replayBtn.style.display = '';
  }

})();
</script>

<!-- Snow -->
<script>
  var c = document.getElementById('snow'), cx = c.getContext('2d');
  function rsz() { c.width = innerWidth; c.height = innerHeight; }
  window.addEventListener('resize', rsz); rsz();
  var fl = Array.from({length:50}, function() { return {
    x: Math.random()*innerWidth, y: Math.random()*innerHeight,
    r: Math.random()*1.5+0.3, s: Math.random()*0.38+0.1, d: (Math.random()-.5)*0.18
  }; });
  function draw() {
    cx.clearRect(0,0,c.width,c.height); cx.fillStyle='#fff';
    fl.forEach(function(f) {
      cx.beginPath(); cx.arc(f.x,f.y,f.r,0,Math.PI*2); cx.fill();
      f.y+=f.s; f.x+=f.d;
      if(f.y>c.height+4){f.y=-4;f.x=Math.random()*c.width;}
      if(f.x<-4)f.x=c.width+4; if(f.x>c.width+4)f.x=-4;
    });
    requestAnimationFrame(draw);
  }
  draw();
</script>
